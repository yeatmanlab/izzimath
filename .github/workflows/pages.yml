name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the generator and checks are plain Node.
      - name: Validate content
        run: node scripts/check.mjs

      # Custom domain at the apex, so the site is served from the root and BASE is
      # empty. build.mjs writes the CNAME file from SITE, so this is the single
      # place the domain is configured.
      - name: Build
        run: node build.mjs
        env:
          SITE: https://izzimath.com

      - name: Check links
        run: node scripts/links.mjs

      - name: Check accessibility
        run: node scripts/a11y.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
