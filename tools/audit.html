<!DOCTYPE html><html><head><meta charset="utf-8"><title>responsive audit</title>
<style>body{background:#0A0D1C;color:#EAF0FF;font:11px/1.5 monospace;margin:0;padding:10px}pre{white-space:pre-wrap}</style></head><body>
<pre id="out">running…</pre>
<script>
const PAGES = [
  ['/', 'home'], ['/grades/', 'grades index'], ['/grades/K/', 'grade K'], ['/grades/5/', 'grade 5'],
  ['/books/', 'books index'], ['/games/', 'games index'], ['/printables/', 'printables'],
  ['/skills/', 'by skill'], ['/parents/', 'how to help'], ['/references/', 'references'],
  ['/roam/', 'roam'], ['/about/', 'about'], ['/404.html', '404'],
  ['/books/counting-crew/', 'book: counting-crew'], ['/books/fraction-number-line/', 'book: fraction NL'],
  ['/books/all-kinds-of-stories/', 'book: stories'], ['/books/standard-algorithm/', 'book: std algorithm'],
  ['/games/great-race/', 'game: great race'], ['/games/close-to-hundred/', 'game: close to 100'],
  ['/games/decade-duel/', 'game: decade duel'],
  ['/print/times-table-tower/', 'print: times table'], ['/print/counting-crew/', 'print: counting crew'],
  ['/print/fraction-number-line/', 'print: fraction NL'],
  // The two page types added later. A new page type that the responsive audit
  // does not list is a page type nobody is checking, which is how the print
  // overflow went unnoticed for so long.
  ['/plans/', 'plans index'], ['/plans/grade-4-fractions/', 'plan: g4 fractions'],
  ['/ssdd/', 'ssdd index'], ['/ssdd/g3-four-by-six/', 'ssdd: g3 array'],
  ['/guide/', 'guide — everything on one page'],
  ['/ssdd/k-two-rows/', 'ssdd: K counters'],
  ['/cup/', 'the character cup'],
  ['/learn/time/', 'lesson: clocks'], ['/learn/money/', 'lesson: coins'],
  ['/books/clocks-and-time/', 'book: clocks and time'], ['/books/money-math/', 'book: money math'],
  ['/print/money-math/', 'print: money math'],
  // The three modules that finished the time-and-money set. Listed even though
  // two of them share a shape with the pages above, because "same shape" is a
  // judgement and a missing page is silent: `longer-and-shorter` draws a clock
  // with NO numerals at Kindergarten sizing, and `dimes-and-pennies` puts a
  // coin row inside an input prompt, neither of which existed before.
  ['/books/time-to-five-minutes/', 'book: time to 5 min'],
  ['/books/longer-and-shorter/', 'book: longer and shorter'],
  ['/books/dimes-and-pennies/', 'book: dimes and pennies'],
];
const WIDTHS = [[360,'phone-sm'],[390,'phone'],[768,'tablet'],[1024,'laptop'],[1440,'desktop']];
const L=[]; let checks=0;
/* Set for one width only — see the note in measure(). */
let svgPass=false;
const svgSeen=new Map();
const frame=document.createElement('iframe');
frame.style.cssText='position:fixed;left:-99999px;top:0;border:0';
document.body.appendChild(frame);
/* SVG <text> IS A BLIND SPOT IN BOTH OTHER CHECKERS, and a real bug lived in it.
   scripts/a11y.mjs reads built HTML and cannot compute a colour against its
   background; the text-size rule below only walks `p, li, td, span, small`. So
   the clock dial's numerals shipped at 10px in --txt3, which is 3.63:1 against
   the panel — and reading the dial IS the task on those items ("the long hand is
   pointing at the 7"). Nothing would have caught it.
   AA thresholds: 4.5:1, or 3:1 for text at 24px, or 18.66px bold. */
const relLum=(c)=>{const m=(c||'').match(/[\d.]+/g); if(!m||m.length<3)return null;
  const f=m.slice(0,3).map(Number).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*f[0]+0.7152*f[1]+0.0722*f[2];};

function measure(){
  const d=frame.contentDocument,w=frame.contentWindow;
  if(!d||!d.body)return null;
  const docOverflow=Math.max(0,d.documentElement.scrollWidth-w.innerWidth);
  const wide=[],tiny=[],smallText=[];
  const inScroller = (el) => {
    for(let p=el.parentElement;p;p=p.parentElement){
      const ox=w.getComputedStyle(p).overflowX;
      if(ox==='auto'||ox==='scroll') return true;
    }
    return false;
  };
  for(const el of d.querySelectorAll('body *')){
    const r=el.getBoundingClientRect();
    // A wide child of a deliberately scrollable box is not an overflow bug —
    // that is what the scroller is for. Only unscrolled overflow counts.
    if(r.width>w.innerWidth+1.5&&r.height>0
       &&w.getComputedStyle(el).position!=='fixed'
       &&!inScroller(el))
      wide.push(el.tagName.toLowerCase()+'@'+Math.round(r.width));
  }
  /* COST: this runs at ONE width only, and caches by fill+size. Contrast does
     not change with the viewport, and the first version — getComputedStyle per
     text node plus a getComputedStyle parent walk for the background, on every
     page at every width — took the harness from about two minutes to past seven
     and it had reached page 8 of 38. The overlap check above had already taught
     the same lesson once. */
  const dimSvg=[];
  if(svgPass){
    let pageBg=null;
    for(const t of d.querySelectorAll('svg text')){
      const r=t.getBoundingClientRect(); if(!r.width||!r.height)continue;
      const cs=w.getComputedStyle(t);
      const key=cs.fill+'|'+cs.fontSize+'|'+cs.fontWeight;
      if(svgSeen.has(key)){ const v=svgSeen.get(key); if(v)dimSvg.push(v); continue; }
      if(pageBg===null){
        // Once per page: the panels these figures sit in share one background.
        let bgc=null;
        for(let p=t.parentElement;p;p=p.parentElement){
          const c=w.getComputedStyle(p).backgroundColor;
          if(c&&c!=='rgba(0, 0, 0, 0)'){bgc=c;break;}
        }
        pageBg=relLum(bgc||w.getComputedStyle(d.body).backgroundColor);
      }
      const fg=relLum(cs.fill);
      if(fg==null||pageBg==null){ svgSeen.set(key,null); continue; }
      const ratio=(Math.max(fg,pageBg)+0.05)/(Math.min(fg,pageBg)+0.05);
      const px=parseFloat(cs.fontSize)||0;
      const need=(px>=24||(px>=18.66&&(parseInt(cs.fontWeight)||400)>=700))?3:4.5;
      const hit=ratio<need? Math.round(px)+'px '+cs.fill+' '+ratio.toFixed(2)+':1 (needs '+need+')' : null;
      svgSeen.set(key,hit);
      if(hit)dimSvg.push(hit);
    }
  }
  for(const el of d.querySelectorAll('a,button,select,input')){
    const r=el.getBoundingClientRect();
    // inline links inside a sentence are exempt from the target-size rule
    const inline=el.closest('p,li,dd,td,.sub,.lede,.refbody');
    if(r.width>0&&r.height>0&&r.height<24&&!inline) tiny.push(el.tagName.toLowerCase()+'@'+Math.round(r.height));
  }
  for(const el of d.querySelectorAll('p,li,td,span,small')){
    const fs=parseFloat(w.getComputedStyle(el).fontSize);
    if(fs&&fs<11&&el.textContent.trim().length>3&&!el.closest('.sheet')) smallText.push(fs+'px '+el.tagName.toLowerCase());
  }
  /* The pinned suggestion button is position:fixed above the content, so it can
     win a hit-test against whatever it happens to sit over. That is fine for a
     big card and not fine for an answer: as a 162x40 pill it made the CORRECT
     option unclickable on a grade-1 book and on decade-duel — elementFromPoint
     at the option's centre returned the button, so a child tapping the right
     answer got "Make a suggestion".
     Nothing else here could see it. Overflow, tap size and text size are all
     properties of one element; this is a relationship between two, and it needs
     elementFromPoint rather than a rect. Severity is the ratio: a control whose
     centre is blocked AND which is no bigger than the button has nowhere else to
     be tapped, which is what [no room left] marks.

     I tried gating this on "is there any scroll left to free it" so the
     transient overlaps would go quiet, and took it out again: I could not make
     the gated version fail under the bug it was written for, and a check that
     cannot fail is worse than no check. So it reports every hit and you triage.

     KNOWN AND ACCEPTED as of 2026-09-06: the printables index reports its
     "Print" link at three widths. That page is 4233px tall and the link sits at
     y 851 of a 900px viewport, so scrolling a few pixels frees it — true of any
     pinned control. Two others were real and are fixed: footer links on short
     pages (footer.foot now reserves 88px) and the answer options on books and
     games, where the pill was wide enough to cover a whole option and the button
     now collapses to a 44px circle below 560px. */
  const covered=[];
  const fab=d.querySelector('.fbk-btn');
  if(fab){
    const fr=fab.getBoundingClientRect(), fa=fr.width*fr.height;
    for(const el of d.querySelectorAll('a[href],button,input,select,textarea')){
      if(el.closest('.fbk'))continue;
      const r=el.getBoundingClientRect();
      if(!r.width||!r.height)continue;
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      if(cy<0||cy>w.innerHeight||cx<0||cx>w.innerWidth)continue;
      /* Cheap rect test BEFORE elementFromPoint. Hit-testing forces a layout on
         every call, and running it over every control on 20 pages x 5 widths
         took this harness from 55 seconds to over four minutes. Only the handful
         of controls whose centre is inside the button's box can possibly be
         covered, so only those are worth asking about. */
      if(cx<fr.left||cx>fr.right||cy<fr.top||cy>fr.bottom)continue;
      const top=d.elementFromPoint(cx,cy);
      if(top&&top.closest('.fbk')&&!el.contains(top)&&top!==el){
        const label=(el.textContent||el.value||el.tagName).replace(/\s+/g,' ').trim().slice(0,18)||el.tagName;
        covered.push(label+(r.width*r.height<=fa?' [no room left]':''));
      }
    }
  }
  return {docOverflow,wide:[...new Set(wide)].slice(0,4),tiny:[...new Set(tiny)].slice(0,3),smallText:[...new Set(smallText)].slice(0,3),covered:[...new Set(covered)].slice(0,4),dimSvg:[...new Set(dimSvg)].slice(0,3)};
}
(async()=>{
  for(const [w,wn] of WIDTHS){
    frame.style.width=w+'px'; frame.style.height='900px';
    svgPass = w===1024;   // widest common desktop; contrast is width-independent
    L.push(''); L.push('════ '+wn+' ('+w+'px) ════');
    for(const [url,name] of PAGES){
      await new Promise(res=>{frame.onload=res;frame.src=url;});
      await new Promise(r=>setTimeout(r,260));
      const m=measure(); checks++;
      if(!m){L.push('  ?? '+name);continue;}
      const p=[];
      if(m.docOverflow>1)p.push('OVERFLOW '+m.docOverflow+'px');
      if(m.wide.length)p.push('wide: '+m.wide.join(' '));
      if(m.tiny.length)p.push('small tap: '+m.tiny.join(' '));
      if(m.smallText.length)p.push('small text: '+m.smallText.join(' '));
      if(m.dimSvg.length)p.push('faint svg text: '+m.dimSvg.join(', '));
      if(m.covered.length)p.push('under the pinned button: '+m.covered.join(', '));
      L.push((p.length?'  ✗ ':'  · ')+name.padEnd(26)+(p.join(' | ')||'ok'));
    }
  }
  L.push(''); L.push('CHECKS_RUN='+checks);   // a guard: zero means the harness never ran
  document.getElementById('out').textContent=L.join('\n');
  window.__DONE__=true;
})();
</script></body></html>
