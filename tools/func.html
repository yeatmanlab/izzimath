      const esc = new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true });
      box.dispatchEvent(esc);
      t('Tab from the panel stays inside', box.contains(d.activeElement));
      t('count reaches the header', /\d+★/.test(d.querySelector('[data-me-name]')?.textContent || ''),
        d.querySelector('[data-me-name]')?.textContent);
      d.querySelector('.meclose')?.click(); await sleep(120);

      /* The scroll half of the bug only appears when the panel cannot fit: the
         browser scrolls a focused control into view, and anything above it goes
         off the top. This harness runs in a 3000px-tall frame where the panel
         always fits, so asserting scrollTop there passes no matter what. Cap the
         height and make the condition real. */
      const cap = d.createElement('style');
      cap.textContent = '.mepanel{max-height:240px}';
      d.head.appendChild(cap);
      d.querySelector('[data-me]').click(); await sleep(350);
      const cbox = d.querySelector('.mepanel');
      t('a panel too tall to fit still scrolls', cbox.scrollHeight > cbox.clientHeight,
        cbox.scrollHeight + ' > ' + cbox.clientHeight);
      t('a cramped panel opens at the top', cbox.scrollTop === 0, 'scrollTop ' + cbox.scrollTop);
      t('the greeting stays above the fold', (() => {
        const h = d.querySelector('.meh');
        return h.getBoundingClientRect().top >= cbox.getBoundingClientRect().top - 1;
      })());
      cap.remove();
      d.querySelector('.meclose')?.click(); await sleep(120);
    }

    /* Unwritable storage must be REPORTED, not faked. In Safari private
       browsing, with site data off, or on a full quota, setItem throws — and the
       first build walked a child through all three screens, said "Hello,
       Noodle!", and lost the profile the moment anything re-read storage. */
    {
      const realSet = w.localStorage.setItem.bind(w.localStorage);
      const brick = () => Object.defineProperty(w.localStorage, 'setItem',
        { configurable: true, value: () => { throw new w.DOMException('QuotaExceededError'); } });
      const unbrick = () => Object.defineProperty(w.localStorage, 'setItem',
        { configurable: true, value: realSet });

      await w.__izziProfile.store.signOut();
      d.querySelector('.meclose')?.click(); await sleep(120);
      brick(); w.__izziProfile.repaint(); await sleep(200);
      d.querySelector('[data-me]').click(); await sleep(300);
      const upfront = d.querySelector('.meh')?.textContent || '';
      t('blocked storage is reported up front', /cannot be saved/i.test(upfront), '"' + upfront.slice(0, 40) + '"');
      t('does not offer the flow it cannot finish', !d.querySelector('[data-new]'));

      // and if it breaks mid-flow, after the probe passed
      unbrick(); w.__izziProfile.repaint(); await sleep(150);
      d.querySelector('.meclose')?.click(); await sleep(120);
      d.querySelector('[data-me]').click(); await sleep(250);
      d.querySelector('[data-new]').click(); await sleep(300);
      d.querySelector('[data-av="12"]').click(); await sleep(220);
      d.querySelectorAll('[data-name]')[0].click(); await sleep(220);
      brick();
      d.querySelector('[data-food]').click(); await sleep(450);   // whatever the tray offers
      const mid = d.querySelector('.meh')?.textContent || '';
      t('mid-flow failure is not faked', !/^Hello,/.test(mid), '"' + mid.slice(0, 40) + '"');
      unbrick(); d.querySelector('.meclose')?.click(); await sleep(120);
      w.__izziProfile.repaint(); await sleep(150);
    }

    /* Nothing may be written while signed out. Counting docs before and after,
       rather than asserting something that is true either way — the first
       version of this check had `|| true` on the end and could not fail. */
    await w.__izziProfile.store.signOut();
    const keysBefore = Object.keys(JSON.parse(w.localStorage.getItem('izzi.profiles.v1') || '{}')).length;
    await w.__izziProfile.noteProgress('array-architect', { played: true });
    await sleep(80);
    const keysAfter = Object.keys(JSON.parse(w.localStorage.getItem('izzi.profiles.v1') || '{}')).length;
    t('no writes while signed out', keysAfter === keysBefore, keysBefore + ' docs before, ' + keysAfter + ' after');
  } catch (e) {
    t('harness itself', false, 'THREW ' + e.message);
  }
  frame.remove();
}

/* ----------------------------------------------- submitting versus moving on
   "Check" and "Next" were both .btn.pri, so nothing on the page said which one
   recorded an answer. Next never submitted — it only turned the page, and the
   question was then silently not counted at the end. These guard the three
   things that fixed it: one unmistakable submit button, a way past that says
   Skip and is not primary, and a skip that announces itself. */
L.push('');
{
  const bf = document.createElement('iframe');
  bf.style.cssText = 'position:absolute;left:-99999px;top:0;width:1000px;height:1100px';
  bf.src = '/books/tens-and-ones/?seed=8817';
  document.body.appendChild(bf);
  await new Promise((r) => { bf.onload = r; setTimeout(r, 8000); });
  const bd = bf.contentDocument, bw = bf.contentWindow;
  const bc = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('book:' + n).padEnd(30) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  // the sleeps above are scoped to their own blocks
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    await nap(500);
    /* This book now opens with a Which One Doesn't Belong warm-up, so the book
       itself is one screen further in. Getting there through the skip control is
       deliberate: it is also the proof that a parent who came for practice can
       reach page one, which is an acceptance criterion for the routine work. */
    bc('a warm-up runs before page 1', !!bd.querySelector('[data-skipwarm]'),
      bd.querySelector('.rt-kind')?.textContent || 'NO ROUTINE');
    bd.querySelector('[data-skipwarm]')?.click();
    await nap(200);
    bc('skipping the warm-up lands on question 1', /Question 1/.test(bd.querySelector('.qnum')?.textContent || ''),
      bd.querySelector('.qnum')?.textContent?.trim());
    const fwd = () => bd.querySelector('.sfoot.qnav [data-next], .sfoot.qnav [data-finish]');

    // one submit button, and it is the ONLY primary-weight thing on the page
    bc('one submit button', bd.querySelectorAll('.btn.go').length === 1);
    bc('submit is wider than the way past', (() => {
      const go = bd.querySelector('.btn.go').getBoundingClientRect();
      return go.width > fwd().getBoundingClientRect().width * 2;
    })(), Math.round(bd.querySelector('.btn.go').getBoundingClientRect().width) + 'px vs '
      + Math.round(fwd().getBoundingClientRect().width) + 'px');
    bc('nothing else claims primary weight',
      bd.querySelectorAll('.sfoot.qnav .btn.pri').length === 0);
    bc('the way past says Skip, not Next', /Skip/.test(fwd().textContent), fwd().textContent.trim());

    /* "Show me and move on" did only the moving on — its handler was
       `page++; paint()`, so the one button offering to explain made the
       question disappear unexplained. It has to SHOW something, name the
       answer, and not navigate away from what it just revealed. */
    {
      const inp = bd.querySelector('.sbody input');
      if (!inp) bc('a wrong answer offers to show the answer', false, 'no input on this page to drive');
      else {
        inp.value = '1';
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        bd.querySelector('.btn.go')?.click();
        await nap(220);
        const rev = bd.querySelector('[data-reveal]');
        bc('a wrong answer offers to show the answer', !!rev, rev?.textContent.trim() || 'no such button');
        const wasOn = bd.querySelector('.qnum')?.textContent.trim();
        rev?.click();
        await nap(220);
        const box = bd.querySelector('[data-showbox]');
        bc('and pressing it shows one', !!box?.textContent.trim(),
          (box?.textContent || 'NOTHING WAS SHOWN').replace(/\s+/g, ' ').trim().slice(0, 50));
        bc('it names the answer, not just the method', /answer is/i.test(box?.textContent || ''));
        bc('and does not move on from what it revealed',
          bd.querySelector('.qnum')?.textContent.trim() === wasOn,
          'still on ' + bd.querySelector('.qnum')?.textContent.trim());
        bc('the button retires once used', !bd.querySelector('[data-reveal]'));
        bd.querySelector('[data-retry]')?.click();
        await nap(160);
      }
    }

    /* `hidden` must actually hide: .fb sets display:inline-flex, which beats the
       browser's own [hidden]{display:none}, so the answer box's hidden "Type an
       answer first" rendered as a small empty capsule under every question. */
    bc('hidden elements have no box', [...bd.querySelectorAll('[hidden]')]
      .every((e) => e.getBoundingClientRect().height === 0),
      bd.querySelectorAll('[hidden]').length + ' hidden');

    // skipping announces itself, names the question, and offers the way back
    fwd().click(); await nap(350);
    const note = bd.querySelector('.skipnote');
    bc('skipping says so', !!note, (note?.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 52));
    bc('it names the question left behind', /Question 1\b/.test(note?.textContent || ''));
    bc('and says nothing was recorded', /no answer was recorded/i.test(note?.textContent || ''));
    bc('it offers the way back', !!note?.querySelector('[data-backto]'));
    note.querySelector('[data-backto]').click(); await nap(350);
    bc('the way back returns to it', /Question 1\b/.test(bd.querySelector('.qnum')?.textContent || ''),
      bd.querySelector('.qnum')?.textContent);

    // answering promotes the forward button instead
    const inp = bd.querySelector('input.ans');
    inp.value = '31';
    bd.querySelector('.btn.go').click(); await nap(350);
    bc('answering changes the way past to Next', /Next/.test(fwd().textContent), fwd().textContent.trim());
    bc('and makes it the primary action', fwd().classList.contains('pri'));

    /* An answered question must stop counting as skipped. Without clearing it,
       the finish screen reported a skip the child had gone back and done. */
    bc('a question done later is no longer skipped',
      !/was skipped/.test(bd.querySelector('.skipnote')?.textContent || ''));
  } catch (e) {
    bc('harness itself', false, 'THREW ' + e.message);
  }
  bf.remove();
}

/* -------------------------------------------------- the tour, driven for real
   Three panels, two of them a press. The mechanic is that pressing the REAL
   control is what advances it, so these assert on that rather than on copy:
   no Next until something has been pressed, the site actually changes behind
   the dialog, and the last panel names the features it claims to. */
L.push('');
{
  const tf = document.createElement('iframe');
  tf.style.cssText = 'position:absolute;left:-99999px;top:0;width:1000px;height:1100px';
  tf.src = '/';
  document.body.appendChild(tf);
  await new Promise((r) => { tf.onload = r; setTimeout(r, 8000); });
  const td = tf.contentDocument, tw = tf.contentWindow;
  /* A failing check with no note used to print "ok" beside the cross, because
     the note defaulted to 'ok' whatever the verdict — so the one line a reader
     scans for contradicted itself. */
  const tc = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('tour:' + n).padEnd(34) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  const kip = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    await kip(500);
    // nothing appears unbidden
    tc('nothing opens by itself', !td.querySelector('.tpanel'));
    const door = td.querySelector('[data-tour]');
    tc('there is a door, and it is not in the nav', !!door && !door.closest('nav'),
      door?.textContent.trim());

    door.click(); await kip(400);
    const panel = () => td.querySelector('.tpanel');
    tc('it opens a modal dialog', panel()?.getAttribute('role') === 'dialog'
      && panel()?.getAttribute('aria-modal') === 'true');
    /* Derived, not 4. This asserted a literal count and broke the day a fourth
       character shipped — the number is not the harness's to know. The tour now
       builds from characterList, same as the nav picker, so this follows it. */
    const wantFaces = C.characterList.length;
    tc('step 1 offers one class of target',
      td.querySelectorAll('.tface').length === wantFaces
      && td.querySelectorAll('.tpanel button:not(.tclose):not(.tface)').length === 0,
      td.querySelectorAll('.tface').length + '/' + wantFaces + ' faces, ' +
      td.querySelectorAll('.tpanel button:not(.tclose):not(.tface)').length + ' other buttons');

    /* And in the same ORDER as the nav picker, which means not leading with
       "Just math". The tour used Object.keys(characters), where `none` is
       declared first, so the first button — and the one that took focus — was
       the single option that barely changes anything, directly under copy
       promising the whole page will change. */
    const tourOrder = [...td.querySelectorAll('.tface')].map((b) => b.dataset.tch);
    tc('the faces are in the picker\u2019s order, so it does not lead with Just math',
      tourOrder.join(',') === C.characterList.join(',') && tourOrder[0] !== 'none',
      tourOrder.join(' '));
    tc('and the focused face is a character, not Just math',
      td.activeElement?.dataset?.tch !== 'none',
      td.activeElement?.dataset?.tch || '(nothing focused)');
    /* No Next until something has been pressed. That IS the mechanic: the
       consequence is the instruction, so an unearned Next skips the lesson. */
    tc('no Next before anything is pressed', !td.querySelector('[data-tnext]'));

    const before = td.documentElement.dataset.ch;
    td.querySelector('[data-tch="flame"]').click(); await kip(450);
    tc('pressing a face changes the whole site', td.documentElement.dataset.ch === 'flame',
      before + ' -> ' + td.documentElement.dataset.ch);
    tc('and only then does Next appear', !!td.querySelector('[data-tnext]'));
    const said = td.querySelector('.tsaid-c')?.textContent || '';
    tc('it says what just happened', /Flame/.test(said), said.slice(0, 46));
    tc('and the detail line is not addressed to a third party',
      !/your child/i.test(td.querySelector('.tsaid-more')?.textContent || ''));

    td.querySelector('[data-tnext]').click(); await kip(400);
    tc('step 2 shows real sums', td.querySelectorAll('.tsum').length === 3,
      [...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim()).join(' '));
    tc('the sums are distinct',
      new Set([...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim())).size === 3);
    const first = [...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim()).join('|');
    td.querySelector('[data-tnew]').click(); await kip(400);
    const second = [...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim()).join('|');
    tc('pressing it changes the numbers', first !== second, second);
    tc('and only then does Next appear', !!td.querySelector('[data-tdone]'));

    td.querySelector('[data-tdone]').click(); await kip(400);
    const rows = [...td.querySelectorAll('.tway dt')].map((e) => e.textContent.trim());
    tc('the last panel maps the site', rows.length >= 8, rows.join(', '));
    /* The features a new visitor most needs and least easily finds. /plans/ has
       zero editorial inbound links in the whole site, so a tour that omits it
       leaves it exactly as invisible as it was. */
    for (const want of ['Grades', 'Books', 'Games', 'Printables', 'Badges', 'By skill', 'Plans', 'How to help']) {
      checks++;
      if (!rows.includes(want)) L.push('\u2717 ' + ('tour:names ' + want).padEnd(34) + '  MISSING');
    }
    const mapText = td.querySelector('.tways').textContent;
    tc('no unresolved count placeholder', !/\{\w+\}|undefined|NaN/.test(mapText),
      (mapText.match(/\{\w+\}|undefined|NaN/) || ['clean'])[0]);
    /* Derived, never literal. This asserted a hard-coded 45 and went red the
       day the catalogue grew — the point is that the tour quotes the REAL
       counts, so the expected value has to come from the same place the tour
       gets it from. */
    const wantTotal = String(A.activities.length);
    const wantBadges = String(BG.BADGE_COUNT);
    tc('counts are real numbers',
      new RegExp('\\b' + wantTotal + '\\b').test(mapText) && new RegExp('\\b' + wantBadges + '\\b').test(mapText),
      `${wantTotal} activities, ${wantBadges} badges`);
    tc('it offers a way on and a way to everything',
      !!td.querySelector('.tfoot .btn.pri') && /guide/.test(td.querySelector('.tfoot .btn:not(.pri)')?.href || ''));

    // Escape closes it and the chosen character survives
    tw.dispatchEvent(new tw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    td.dispatchEvent(new tw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await kip(300);
    tc('Escape closes it', !td.querySelector('.tpanel'));
    tc('the character you chose stays chosen', td.documentElement.dataset.ch === 'flame');
  } catch (e) {
    tc('harness itself', false, 'THREW ' + e.message);
  }
  tf.remove();
}

/* ---------------------------------------------------------- warm-up routines
   A routine is client-rendered inside the book player, so a11y.mjs cannot see
   it and check.mjs can only test the DATA. What has to be tested through a real
   page is the thing the routine IS: a Number Talk that reveals the whole string
   at once is a worksheet, and a Which One Doesn't Belong that marks a cell
   correct is a multiple-choice question. Both of those are UI properties. */
L.push('');
{
  const rc = (n, ok, note) => { checks++; L.push((ok ? '· ' : '✗ ') + ('routine:' + n).padEnd(38) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));
  const open = async (url) => {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:absolute;left:-99999px;top:0;width:1000px;height:1400px';
    f.src = url;
    document.body.appendChild(f);
    await new Promise((r) => { f.onload = r; setTimeout(r, 8000); });
    await nap(500);
    return f;
  };
  const tall = (e) => (e ? e.getBoundingClientRect().height : 0);

  try {
    // ---- Number Talk
    const f = await open('/books/adding-to-twenty/?seed=8817');
    const d = f.contentDocument;
    rc('a number talk opens the book', /Number Talk/.test(d.querySelector('.rt-kind')?.textContent || ''),
      d.querySelector('.rt-kind')?.textContent);
    rc('it names its target strategy', !!d.querySelector('.rt-target')?.textContent?.trim(),
      d.querySelector('.rt-target')?.textContent?.trim());
    const steps = () => [...d.querySelectorAll('.rt-steps li')];
    rc('the string is four long', steps().length === 4, steps().length + ' steps');
    /* The whole point of the routine: later expressions are WITHHELD. Showing
       all four at once is the failure mode, and it is invisible to a data
       check because the data has all four in it either way. */
    rc('later steps are withheld', steps().filter((li) => li.classList.contains('later')).length === 3,
      steps().map((li) => li.querySelector('.rt-expr').textContent).join(' | '));
    rc('no answer is showing yet', d.querySelectorAll('.rt-ans').length === 0,
      d.querySelectorAll('.rt-ans').length + ' answers visible');
    // Not scored, so nothing has been earned yet. (The browser normalises the
    // inline `width:0` to "0px", so compare the number, not the string.)
    rc('the progress bar has not moved', parseFloat(d.querySelector('.prog i')?.style.width || '0') === 0,
      'width ' + (d.querySelector('.prog i')?.style.width || '0'));

    d.querySelector('[data-show]').click(); await nap(120);
    rc('asking reveals one answer', d.querySelectorAll('.rt-ans').length === 1);
    rc('and the working with it', !!d.querySelector('.rt-hidden')?.textContent?.trim(),
      d.querySelector('.rt-hidden')?.textContent?.slice(0, 42));

    // walk to the end of the string
    for (let k = 0; k < 4; k++) {
      const next = d.querySelector('[data-next]');
      if (next) { next.click(); await nap(120); }
      const show = d.querySelector('[data-show]');
      if (show) { show.click(); await nap(120); }
    }
    const ask = d.querySelector('.rt-ask')?.textContent || '';
    rc('the string closes with a comparison', /alike/.test(ask) && /different/.test(ask), ask.slice(0, 56));
    const exprs = steps().map((li) => li.querySelector('.rt-expr').textContent.trim());
    rc('and quotes two of the four in it', exprs.filter((e) => ask.includes(e)).length === 2,
      exprs.filter((e) => ask.includes(e)).join(' and ') || 'quotes none of them');
    rc('the synthesis is withheld until asked', !!d.querySelector('[data-syn]')?.hidden);
    d.querySelector('[data-syn-show]').click(); await nap(120);
    rc('and then given', d.querySelector('[data-syn]')?.hidden === false,
      d.querySelector('[data-syn]')?.textContent?.slice(0, 44));
    d.querySelector('[data-done]').click(); await nap(200);
    rc('finishing it starts the book', /Question 1/.test(d.querySelector('.qnum')?.textContent || ''),
      d.querySelector('.qnum')?.textContent?.trim());
    f.remove();

    // ---- Which One Doesn't Belong
    const g = await open('/books/tens-and-ones/?seed=8817');
    const gd = g.contentDocument;
    const cells = () => [...gd.querySelectorAll('.rt-cell')];
    rc('a wodb opens the other book', /Doesn/.test(gd.querySelector('.rt-kind')?.textContent || ''),
      gd.querySelector('.rt-kind')?.textContent);
    rc('four cells, all distinct', cells().length === 4
      && new Set(cells().map((c) => c.textContent.trim())).size === 4,
      cells().map((c) => c.textContent.trim()).join(', '));
    rc('cells clear the 24px tap minimum', cells().every((c) => tall(c) >= 24),
      Math.min(...cells().map(tall)).toFixed(0) + 'px smallest');

    cells()[0].click(); await nap(120);
    const said = gd.querySelector('.rt-panel')?.textContent || '';
    rc('picking one gives its reason', /only/.test(said), said.slice(0, 60));
    /* It must never be marked. Three other cells were just as defensible, so
       "correct" is a lie and "wrong" is a worse one. */
    rc('nothing is marked right or wrong', !/\b(correct|wrong|incorrect|not quite)\b/i.test(said)
      && !gd.querySelector('.rt-cell.right, .rt-cell.wrong'), said.slice(0, 40));
    rc('it says the others work too', /try another|so do the others/i.test(said),
      said.match(/So do the others[^.]*\./i)?.[0] || 'did not say so');
    for (const c of cells()) { c.click(); await nap(60); }
    rc('after all four, it says all four work',
      /all four/i.test(gd.querySelector('.rt-panel')?.textContent || ''),
      (gd.querySelector('.rt-panel')?.textContent || '').slice(-52));
    gd.querySelector('[data-syn-show]').click(); await nap(120);
    rc('and answers whether someone else could be right',
      /Yes/.test(gd.querySelector('.rt-panel')?.textContent || ''),
      (gd.querySelector('.rt-panel')?.textContent || '').match(/Yes[^.]*\./)?.[0]?.slice(0, 44));
    g.remove();

    // ---- and a book without one is untouched
    const h = await open('/books/halves-and-quarters/?seed=8817');
    rc('a book with no warm-up starts at question 1',
      /Question 1/.test(h.contentDocument.querySelector('.qnum')?.textContent || '')
      && !h.contentDocument.querySelector('.rt-kind'),
      h.contentDocument.querySelector('.qnum')?.textContent?.trim());
    h.remove();
  } catch (e) {
    rc('harness itself', false, 'THREW ' + e.message);
  }
}

/* --------------------------------------------------------- suggestion button
   The button is static markup, so a11y.mjs sees it, but everything that makes
   it work is not: hover, tap, the dismissal, and the url that finally gets
   opened. window.open is replaced inside the frame so the last one can be
   asserted without navigating anywhere. */
L.push('');
{
  const sc = (n, ok, note) => { checks++; L.push((ok ? '· ' : '✗ ') + ('suggest:' + n).padEnd(38) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:absolute;left:-99999px;top:0;width:900px;height:1000px';
    f.src = '/books/adding-to-twenty/?seed=8817';
    document.body.appendChild(f);
    await new Promise((r) => { f.onload = r; setTimeout(r, 8000); });
    await nap(500);
    const d = f.contentDocument, w = f.contentWindow;
    let opened = null;
    w.open = (url) => { opened = url; return null; };

    const root = d.querySelector('[data-feedback]');
    const btn = d.querySelector('[data-fbk-open]');
    const menu = d.querySelector('[data-fbk-menu]');
    const vis = () => w.getComputedStyle(menu).visibility;
    const box = (el) => el.getBoundingClientRect();

    sc('the button is on an activity page', !!btn, btn?.textContent.trim());
    sc('it is pinned, not in the flow', w.getComputedStyle(root).position === 'fixed',
      w.getComputedStyle(root).position);
    // Lower right, and inside the viewport at this width.
    const b = box(btn);
    sc('pinned to the lower right', b.right > w.innerWidth * 0.6 && b.bottom > w.innerHeight * 0.6
      && b.right <= w.innerWidth && b.bottom <= w.innerHeight,
      `right ${Math.round(w.innerWidth - b.right)}px, bottom ${Math.round(w.innerHeight - b.bottom)}px from the edge`);
    sc('it clears the 24px tap minimum', b.height >= 24, Math.round(b.height) + 'px tall');
    sc('the menu starts hidden', vis() === 'hidden', vis());

    /* Reported from real use: the menu popped up when the pointer was merely
       NEAR the button. The container is as tall as the menu it holds, so as a
       hit-testable box it both opened on approach and swallowed clicks on the
       page content underneath that invisible column. */
    const bb = box(btn);
    const above = d.elementFromPoint(bb.x + bb.width / 2, bb.y - 60);
    sc('the space above it belongs to the page', !!above && !root.contains(above),
      above ? above.tagName.toLowerCase() + '.' + String(above.className).split(' ')[0] : 'nothing there');
    root.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
    await nap(60);
    sc('hovering near it does not open it', vis() === 'hidden', vis());
    btn.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
    await nap(60);
    sc('hovering the button itself does', vis() === 'visible', vis());
    /* And the pointer has to be able to travel from button to menu: a dead strip
       between them closes the menu the moment you reach for it. */
    sc('button and menu touch, no dead strip', box(menu).bottom >= bb.top - 0.5,
      Math.round(bb.top - box(menu).bottom) + 'px between them');
    root.dispatchEvent(new MouseEvent('mouseleave', { bubbles: false }));
    await nap(400);

    btn.click(); await nap(60);
    sc('tapping opens it', vis() === 'visible', vis());
    sc('and says so to a screen reader', btn.getAttribute('aria-expanded') === 'true',
      'aria-expanded=' + btn.getAttribute('aria-expanded'));
    // aria-expanded on its own does not say expanded WHAT.
    sc('and names what it expands', btn.getAttribute('aria-controls') === menu.id && !!menu.id,
      'aria-controls=' + btn.getAttribute('aria-controls'));
    const items = [...d.querySelectorAll('[data-fbk-kind]')];
    sc('it offers both kinds', items.length === 2, items.map((a) => a.textContent.trim().split('\n')[0]).join(' / '));
    /* Without JavaScript these are the whole feature, so they have to be real
       links to the right place rather than buttons dressed as links. */
    /* Without JavaScript these two links are the whole feature, so each has to
       be a real link to whatever route is live. It used to assert a github.com
       URL, which went red the moment the live route became a form — the
       expected value now comes from the same function the markup used. */
    sc('both work without javascript',
      items.every((a) => a.href && a.href === FB.plainUrl(a.dataset.fbkKind)),
      items.map((a) => (a.href ? a.href.replace(/^https?:\/\//, '').slice(0, 30) + '…' : 'no href — not a link')).join(' | '));

    /* The dismissal bug worth a check of its own: Escape closed the menu and put
       focus back on the trigger, which is inside the widget, so :focus-within
       re-opened it immediately and Escape looked broken. */
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await nap(80);
    sc('Escape dismisses it', vis() === 'hidden', vis());
    sc('and does not let focus re-open it', vis() === 'hidden' && d.activeElement === btn,
      'focus on ' + (d.activeElement === btn ? 'the trigger' : d.activeElement.tagName) + ', menu ' + vis());
    btn.click(); await nap(60);
    sc('tapping again brings it back', vis() === 'visible', vis());

    // ---- the form
    d.querySelector('[data-fbk-kind="bug"]').click();
    await nap(150);
    const panel = d.querySelector('.fbk-panel');
    const text = d.querySelector('[data-fbk-text]');
    // Whichever route is live owns the primary action, and it may be a link
    // rather than a button — so "blocked" means no href, not `disabled`.
    const prim = () => d.querySelector('[data-fbk-form], [data-fbk-mail], [data-fbk-send]');
    const blocked = () => { const el = prim(); return el.tagName === 'A' ? !el.hasAttribute('href') : el.disabled; };
    sc('choosing one opens a text box', !!text && !!panel);
    sc('it is a real dialog', panel?.getAttribute('role') === 'dialog'
      && panel?.getAttribute('aria-modal') === 'true');
    sc('focus lands in the box', d.activeElement === text);
    sc('sending is blocked while empty', blocked() === true);
    sc('and the invitation is showing', !d.querySelector('[data-fbk-why]')?.hidden
      && d.querySelector('[data-fbk-why]')?.textContent === FB.kindById('bug').invite,
      d.querySelector('[data-fbk-why]')?.textContent);
    // and it describes whatever the primary action is
    sc('the note describes the primary action',
      prim().getAttribute('aria-describedby') === d.querySelector('[data-fbk-why]')?.id,
      'aria-describedby=' + prim().getAttribute('aria-describedby'));

    text.value = 'The answer key for Tens and Ones printed over two pages #2';
    text.dispatchEvent(new Event('input', { bubbles: true }));
    await nap(60);
    sc('typing enables sending', blocked() === false);
    sc('and counts the characters', d.querySelector('[data-fbk-count]')?.textContent === String(text.value.length),
      d.querySelector('[data-fbk-count]')?.textContent + ' characters');
    /* The page address is shown before anyone sends, because it is going to be
       included and a reader should not discover that on GitHub. */
    sc('the page address is shown first', /adding-to-twenty/.test(panel.textContent),
      (panel.textContent.match(/\/books\/[^\s]*/) || ['not shown'])[0]);

    if (FB.ROUTES.github.on) {
      /* A click, not a form submit: the panel stopped being a <form>, because
         nothing here submits anywhere and being one is a signal iOS uses when
         deciding to offer passwords and credit cards on a suggestion box. */
      d.querySelector('[data-fbk-send]').click();
      await nap(120);
      sc('the GitHub half opens a prefilled issue', !!opened && opened.startsWith('https://github.com/'),
        (opened || 'nothing opened').slice(0, 52));
      if (opened) {
        const u = new URL(opened);
        sc('with the label for the kind chosen', u.searchParams.get('labels') === 'bug',
          'labels=' + u.searchParams.get('labels'));
        sc('and the typed text intact', (u.searchParams.get('body') || '').includes('#2'));
      }
    }
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await nap(80);
    sc('the dialog closes and gives focus back', !d.querySelector('[data-fbk-text]'));

    /* The no-account route, when one is configured: it has to be the loud one,
       and its link has to carry the whole message rather than a bare form URL. */
    if (FB.ROUTES.form.on) {
      d.querySelector('[data-fbk-open]').click(); await nap(60);
      d.querySelector('[data-fbk-kind="bug"]').click(); await nap(150);
      const tf = d.querySelector('[data-fbk-text]');
      const fbtn = d.querySelector('[data-fbk-form]');
      sc('the no-account route is the left, wide half', !!fbtn && fbtn.classList.contains('fbk-main'),
        fbtn?.textContent.trim());
      sc('and is dead until there is something to send', !fbtn.hasAttribute('href')
        && fbtn.getAttribute('aria-disabled') === 'true');
      tf.value = 'The squares are too small to tap on my phone';
      tf.dispatchEvent(new Event('input', { bubbles: true }));
      await nap(60);
      sc('typing arms it', fbtn.hasAttribute('href') && fbtn.getAttribute('aria-disabled') === 'false');
      const fu = new URL(fbtn.href);
      const field = FB.ROUTES.form.textField;
      const got = fu.searchParams.get(field) || '';
      sc('the whole message goes into the form field', got.includes('too small to tap')
        && got.includes('/books/adding-to-twenty/') && /Issue/.test(got),
        field + ' = ' + got.slice(0, 34).replace(/\n/g, ' / '));
      /* There is no screenshot and there cannot usefully be one, so the report
         has to carry what a screenshot would have shown: the seed (inside the
         page address, and the seed IS the state), which question was on screen,
         and how wide the window was. Removing the capture failed nothing until
         this existed. */
      sc('and so does the context a screenshot would have shown',
        /Window: \d+ x \d+/.test(got) && /On screen: /.test(got) && /seed=\d+/.test(got),
        (got.match(/On screen:[^\n]*/) || ['no context at all'])[0]
          + ' | ' + (got.match(/Window:[^\n]*/) || ['no window size'])[0]);
      sc('it opens in a new tab', fbtn.target === '_blank' && /noopener/.test(fbtn.rel), fbtn.target + ' ' + fbtn.rel);
      d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await nap(60);
    }

    /* Opening a second one must replace the first, not stack on it: the loser
       used to stay in the document with a live keydown listener and a duplicate
       set of ids, so `for` and `aria-labelledby` pointed at the stale panel. */
    d.querySelector('[data-fbk-open]').click(); await nap(60);
    d.querySelector('[data-fbk-kind="feature"]').click(); await nap(150);
    sc('the menu closes behind the dialog',
      w.getComputedStyle(menu).visibility === 'hidden', w.getComputedStyle(menu).visibility);
    d.querySelector('[data-fbk-kind="bug"]').click(); await nap(150);
    sc('a second choice replaces the dialog', d.querySelectorAll('.fbk-panel').length === 1,
      d.querySelectorAll('.fbk-panel').length + ' dialogs in the document');
    sc('so no id is duplicated', ['fbk-h', 'fbk-t', 'fbk-why']
      .every((i) => d.querySelectorAll('#' + i).length === 1),
      ['fbk-h', 'fbk-t', 'fbk-why'].map((i) => i + '=' + d.querySelectorAll('#' + i).length).join(' '));
    sc('and the heading is the kind just chosen', /Report an issue/.test(d.querySelector('.fbk-panel h2')?.textContent || ''),
      d.querySelector('.fbk-panel h2')?.textContent);
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await nap(80);

    /* Asked for directly: no reader-facing mention of GitHub anywhere in the
       widget. a11y.mjs covers the static half; the dialog is built at runtime,
       so this is the only place the rendered form can be read. */
    d.querySelector('[data-fbk-open]').click(); await nap(60);
    d.querySelector('[data-fbk-kind="feature"]').click(); await nap(150);
    const shown = d.querySelector('.fbk-panel').textContent
      + ' ' + [...d.querySelectorAll('.fbk-panel [href]')].map((a) => a.getAttribute('href')).join(' ');
    /* A window AROUND the match. `[^.]*github[^.]*` sliced to 46 characters
       reported the panel's opening words instead of the offending phrase,
       because the greedy prefix ran back to the start of the text. */
    const hit = shown.search(/github/i);
    sc('and the panel is not a form at all', !d.querySelector('.fbk-panel form, form.fbk-panel')
      && d.querySelector('.fbk-panel')?.tagName === 'DIV',
      d.querySelector('.fbk-panel')?.tagName?.toLowerCase() || 'no panel');
    /* GitHub is a THIRD way now, sharing one control with the route that needs
       no account: two thirds of the width to the send, one third to GitHub. So
       the rule is no longer "never mention it" — it is that the word appears
       exactly when the route is on, and that it stays the narrower, quieter
       half, because an account is a cost and should not look like the default. */
    sc(FB.ROUTES.github.on ? 'the form offers GitHub as well' : 'the form never mentions GitHub',
      FB.ROUTES.github.on ? hit >= 0 && !!d.querySelector('[data-fbk-send]') : hit < 0,
      hit < 0 ? 'nothing about it' : '…' + shown.slice(Math.max(0, hit - 22), hit + 24).trim() + '…');
    if (FB.ROUTES.github.on) {
      const main = d.querySelector('.fbk-main'), gh = d.querySelector('.fbk-gh');
      const wm = main?.getBoundingClientRect().width ?? 0, wg = gh?.getBoundingClientRect().width ?? 0;
      sc('GitHub is the right-hand third', wm > 0 && wg > 0
        && main.getBoundingClientRect().left < gh.getBoundingClientRect().left
        && Math.abs(wm / (wm + wg) - 2 / 3) < 0.06,
        `${Math.round(wm)}px + ${Math.round(wg)}px = ${Math.round((wm / (wm + wg)) * 100)}% / ${Math.round((wg / (wm + wg)) * 100)}%`);
      sc('it carries the mark and a caption', !!gh?.querySelector('svg')
        && /submit via github/i.test(gh.textContent), gh?.textContent.trim());
      sc('and is named for a screen reader', /github/i.test(gh?.getAttribute('aria-label') || ''),
        gh?.getAttribute('aria-label'));
      sc('the two halves are one control', main.parentElement === gh.parentElement
        && main.parentElement.classList.contains('fbk-split'), main.parentElement.className);
    }
    sc('and the button is named after the kind', /Suggest a feature/.test(d.querySelector('[data-fbk-form], [data-fbk-send], [data-fbk-mail]')?.textContent || ''),
      d.querySelector('[data-fbk-form], [data-fbk-send], [data-fbk-mail]')?.textContent.trim());
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await nap(60);

    /* The context said "Activity: All grades" on /grades/, which is not an
       activity — spotted in a photo of a real report. Off an activity page the
       title is a page title and has to be labelled as one. */
    {
      const g = document.createElement('iframe');
      g.style.cssText = 'position:absolute;left:-99999px;top:0;width:900px;height:1000px';
      g.src = '/grades/';
      document.body.appendChild(g);
      await new Promise((r) => { g.onload = r; setTimeout(r, 8000); });
      await nap(400);
      const gd = g.contentDocument;
      gd.querySelector('[data-fbk-open]').click(); await nap(60);
      gd.querySelector('[data-fbk-kind="feature"]').click(); await nap(160);
      const ctx = gd.querySelector('.fbk-priv code:last-of-type')?.textContent || '';
      sc('off an activity page nothing is called an Activity', !/Activity:/.test(ctx),
        ctx.slice(0, 56) || 'no context line');
      sc('and the page is still named', /Page: /.test(ctx), (ctx.match(/Page: [^·]*/) || ['not named'])[0].trim());
      g.remove();
    }

    // and it must never print
    sc('it is marked not to print', root.classList.contains('noprint'), root.className);
    f.remove();
  } catch (e) {
    sc('harness itself', false, 'THREW ' + e.message);
  }
}

/* ------------------------------------------------------ the look-inside pickers
   Three grade pickers on the home page, one per card, each switching its own
   column and starting on a different grade. All client-rendered, so a11y.mjs
   cannot see any of it — and the whole point of the section is that the grade
   on the card is TRUE, which is exactly what the old hard-coded "Start here"
   got wrong. */
L.push('');
{
  const lc = (n, ok, note) => { checks++; L.push((ok ? '· ' : '✗ ') + ('look:' + n).padEnd(40) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:absolute;left:-99999px;top:0;width:1100px;height:1800px';
    f.src = '/';
    document.body.appendChild(f);
    await new Promise((r) => { f.onload = r; setTimeout(r, 8000); });
    await nap(500);
    const d = f.contentDocument;
    const cols = [...d.querySelectorAll('[data-wheel]')];
    lc('one picker per card', cols.length === 3, cols.length + ' pickers');
    lc('in the order game, workbook, printable',
      cols.map((c) => c.dataset.wheel).join(',') === 'game,workbook,printable',
      cols.map((c) => c.dataset.wheel).join(', '));

    const sel = (c) => c.querySelector('[role="tab"][aria-selected="true"]')?.dataset.g;
    const shown = (c) => [...c.querySelectorAll('.lookpanel')].filter((p) => !p.hidden);
    const gradeTag = (c) => shown(c)[0]?.querySelector('.meta .tag')?.textContent.trim();

    lc('each shows exactly one card', cols.every((c) => shown(c).length === 1),
      cols.map((c) => shown(c).length).join(','));
    lc('they start on different grades', new Set(cols.map(sel)).size === 3,
      cols.map((c) => c.dataset.wheel + '=' + sel(c)).join(', '));
    /* The grade on the card has to match the number that is lit. This is the
       assertion the old section could not have passed: it showed two
       third-grade activities under "Grade is the only question we ask". */
    lc('the grade on the card matches the number lit',
      cols.every((c) => (gradeTag(c) || '').toLowerCase().startsWith(sel(c) === 'K' ? 'kinder' : sel(c))),
      cols.map((c) => sel(c) + '→' + gradeTag(c)).join(', '));

    /* Switching one column must not disturb the others — compared on the
       VISIBLE CARD, not on aria-selected. The first version of this check read
       the attribute, which a leaking picker never touches: a mutation that made
       one picker swap all three columns' cards passed it, because only the
       clicked column's attributes moved. The card on screen is the thing a
       child sees. */
    const before = cols.map((c) => [sel(c), gradeTag(c)]);
    cols[0].querySelector('[data-g="5"]').click();
    await nap(120);
    lc('clicking a number switches that card', sel(cols[0]) === '5' && gradeTag(cols[0]) === '5th',
      sel(cols[0]) + ' → ' + gradeTag(cols[0]));
    lc('and leaves the other two cards alone',
      gradeTag(cols[1]) === before[1][1] && gradeTag(cols[2]) === before[2][1]
      && sel(cols[1]) === before[1][0] && sel(cols[2]) === before[2][0],
      cols.slice(1).map((c) => `${c.dataset.wheel} shows ${gradeTag(c)} with ${sel(c)} lit`).join(', '));
    lc('and every column still agrees with its own number',
      cols.every((c) => (gradeTag(c) || '').toLowerCase().startsWith(sel(c) === 'K' ? 'kinder' : sel(c))),
      cols.map((c) => sel(c) + '→' + gradeTag(c)).join(', '));
    lc('still exactly one card in that column', shown(cols[0]).length === 1,
      shown(cols[0]).length + ' visible');

    // one tab stop per picker, arrows move within it
    const tabs0 = [...cols[0].querySelectorAll('[role="tab"]')];
    lc('one tab stop per picker, not six',
      tabs0.filter((t) => t.tabIndex === 0).length === 1,
      tabs0.filter((t) => t.tabIndex === 0).length + ' focusable');
    tabs0.find((t) => t.tabIndex === 0).dispatchEvent(new KeyboardEvent('keydown', { key: 'Home', bubbles: true }));
    await nap(120);
    lc('Home jumps to the first grade', sel(cols[0]) === 'K', sel(cols[0]));

    // and the numbers are tappable
    const small = Math.min(...tabs0.map((t) => Math.min(t.getBoundingClientRect().width, t.getBoundingClientRect().height)));
    lc('the numbers clear the 24px tap minimum', small >= 24, small.toFixed(0) + 'px smallest side');

    /* Without JavaScript every number is a link to that grade's shelf, which is
       the only thing that still works if the mount never runs. */
    /* These cards stopped being activityCards and quietly lost the mark that
       tells a child they have already done one. Every other card on the site
       carries it, so the home page silently became the exception. */
    lc('the cards can still be marked as done',
      [...cols].every((c) => shown(c)[0]?.querySelector('.lookcard[data-activity] [data-marks]')),
      cols.map((c) => shown(c)[0]?.querySelector('.lookcard')?.dataset.activity || 'no id').join(', '));

    lc('each number is a real link to its grade',
      tabs0.every((t) => new URL(t.href).pathname.endsWith(`/grades/${t.dataset.g}/`)),
      tabs0.map((t) => new URL(t.href).pathname.split('/').filter(Boolean).pop()).join(','));
    f.remove();
  } catch (e) {
    lc('harness itself', false, 'THREW ' + e.message);
  }
}

/* ------------------------------------------------------- pick, clocks, coins
   `pick` is the tenth problem type and the first whose options are figures, so
   none of the existing per-type coverage touches it. Checked here rather than
   in scripts/check.mjs because the renderer, the hit target and the accessible
   name only exist once something has been drawn. */
{
  const pk = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('pick:' + n).padEnd(36) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  try {
    const W = await import('/assets/src/lib/widgets.js');
    const host = document.createElement('div');
    document.body.appendChild(host);
    const opts = [
      { id: 'a', figure: W.clockFace(3, 0, { size: 80 }) },
      { id: 'b', figure: W.clockFace(4, 30, { size: 80 }) },
      { id: 'c', figure: W.clockFace(9, 0, { size: 80 }) },
    ];
    let got = null;
    RD.renderProblem(host, { type: 'pick', prompt: 'Which clock shows half past 4?',
      options: opts, answer: 'b', answerSay: 'half past 4' }, (resp, ok) => { got = { resp, ok }; });
    const buttons = [...host.querySelectorAll('button.pick')];
    pk('renders one button per option', buttons.length === 3, buttons.length + ' buttons');
    pk('the tap target clears the 24px floor',
      buttons.every((b) => b.getBoundingClientRect().width >= 24 && b.getBoundingClientRect().height >= 24),
      buttons[0] ? Math.round(buttons[0].getBoundingClientRect().width) + 'x' + Math.round(buttons[0].getBoundingClientRect().height) : '-');
    /* The name comes from the figure's own label, so a screen-reader user reads
       hand positions and still has to interpret them. A name of "half past 4"
       would let them match strings instead of reading a clock. */
    pk('each option is named by its figure, not by the answer',
      buttons.every((b) => /short hand/.test(b.getAttribute('aria-label') || '')),
      buttons[0]?.getAttribute('aria-label')?.slice(0, 40));
    pk('the inner figure is not read twice',
      buttons.every((b) => b.querySelector('svg')?.getAttribute('aria-hidden') === 'true'));
    buttons[1].click();
    pk('a right pick reports right', got && got.ok === true && got.resp === 'b', JSON.stringify(got));
    pk('the chosen option is marked', buttons[1].classList.contains('right'));

    const host2 = document.createElement('div');
    document.body.appendChild(host2);
    let got2 = null;
    RD.renderProblem(host2, { type: 'pick', prompt: 'x', options: opts, answer: 'b' }, (resp, ok) => { got2 = ok; });
    const b2 = [...host2.querySelectorAll('button.pick')];
    b2[0].click();
    pk('a wrong pick reports wrong and shows the right one',
      got2 === false && b2[1].classList.contains('right') && b2[0].classList.contains('wrong'));

    /* The coin sizes are the misconception. Measured on the rendered SVG, since
       CSS is what broke it last time. */
    const cwrap = document.createElement('div');
    cwrap.innerHTML = W.COIN_KINDS.map((k) => W.coin(k, { size: 60 })).join('');
    document.body.appendChild(cwrap);
    const widths = {};
    [...cwrap.querySelectorAll('svg')].forEach((sv, i) => { widths[W.COIN_KINDS[i]] = sv.getBoundingClientRect().width; });
    pk('the dime draws smaller than the nickel', widths.dime < widths.nickel,
      'dime ' + Math.round(widths.dime) + ' vs nickel ' + Math.round(widths.nickel));
    pk('the drawn order is the real mint order',
      widths.dime < widths.penny && widths.penny < widths.nickel && widths.nickel < widths.quarter,
      Object.entries(widths).map(([k, v]) => k + ' ' + Math.round(v)).join(', '));
    cwrap.remove(); host.remove(); host2.remove();
  } catch (e) {
    pk('harness itself', false, 'THREW ' + e.message);
  }
}

/* ---------------------------------------------------------- the character cup
   Client-rendered, so scripts/check.mjs cannot see it — same reason the profile
   panel is tested here. The two views have different rules and the difference is
   the whole safety argument: characters get places, children never do. */
{
  const cb = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('cup:' + n).padEnd(36) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  try {
    const d = document.createElement('div');
    d.setAttribute('data-cup', '');
    document.body.appendChild(d);
    const LB = await import('/assets/src/mount/leaderboard.js');
    const rows = [{ id: 'ash', badges: 9, right: 40, plays: 4 }, { id: 'kiwi', badges: 3, right: 90, plays: 9 }];
    const players = [
      { id: 'a', name: 'Pip', avatar: 4, activities: 6, sheets: 1, badges: 0 },
      { id: 'b', name: 'Bo', avatar: 9, activities: 2, sheets: 0, badges: 21 },
    ];

    LB.renderCup(d, { rows, players, view: 'characters' });
    cb('character view numbers every row', d.querySelectorAll('.cuprow .cupplace').length === 4,
      d.querySelectorAll('.cuprow').length + ' rows, ' + d.querySelectorAll('.cupplace').length + ' places');
    cb('the leader is marked', !!d.querySelector('.cuprow.lead'));
    cb('each row carries its own accent',
      new Set([...d.querySelectorAll('.cuprow')].map((r) => r.style.getPropertyValue('--acc'))).size === 4);
    cb('the bar is hidden from a screen reader',
      [...d.querySelectorAll('.cupbar')].every((b) => b.getAttribute('aria-hidden') === 'true'));
    cb('every row states its standing in text',
      [...d.querySelectorAll('.cuprow')].every((r) => /badge/.test(r.querySelector('.sr')?.textContent || '')));

    /* Three pill states, not two. A character holding one badge is at level 0,
       because the first level needs three — so the pill read NOT STARTED beside
       a badge count of 1, which is simply false. */
    LB.renderCup(d, { rows: [{ id: 'ash', badges: 1 }, { id: 'kiwi', badges: 9 }], players, view: 'characters' });
    const pill = (name) => [...d.querySelectorAll('.cuprow')]
      .find((r) => r.querySelector('.cupname')?.textContent === name)?.querySelector('.cuplv')?.textContent?.trim();
    cb('a character with badges but no level shows the gap', /to Explorer/.test(pill('Ash') || ''), 'Ash: ' + pill('Ash'));
    cb('a character with a level shows the level', /Adventurer/.test(pill('Kiwi') || ''), 'Kiwi: ' + pill('Kiwi'));
    cb('only a character at zero reads as not started',
      (pill('Flame') || '') === 'not started' && !/not started/.test(pill('Ash') || ''),
      'Flame: ' + pill('Flame'));

    LB.renderCup(d, { rows, players, view: 'players', activeId: 'b' });
    cb('players view gives NOBODY a place', d.querySelectorAll('.cuprow .cupplace').length === 0,
      d.querySelectorAll('.cupplace').length + ' places found');
    cb('players ordered on effort, not badges',
      (d.querySelector('.cuprow .cupname')?.textContent || '') === 'Pip',
      'first row: ' + (d.querySelector('.cuprow .cupname')?.textContent || '(none)'));
    cb('the reader can see which one is theirs', !!d.querySelector('.cuprow.mine .cupmine'));
    cb('players show an avatar', !!d.querySelector('.cuprow.plr svg'));

    const tabs = [...d.querySelectorAll('.cuptab')];
    cb('there are two views to choose from', tabs.length === 2, tabs.map((t) => t.textContent.trim()).join(' / '));
    cb('exactly one view reads as pressed',
      tabs.filter((t) => t.getAttribute('aria-pressed') === 'true').length === 1);

    /* The friend who is on is marked, and only that one. renderCup is pure, so
       this is the markup half; the press itself needs the real page and is
       below. */
    LB.renderCup(d, { rows, players, view: 'characters', ch: 'kiwi' });
    const on = [...d.querySelectorAll('[data-cup-ch]')].filter((r) => r.getAttribute('aria-pressed') === 'true');
    cb('the friend you are playing as is marked', on.length === 1 && on[0].dataset.cupCh === 'kiwi',
      on.map((r) => r.dataset.cupCh).join(',') || 'none marked');
    cb('and says so in words, not only in colour',
      /playing/i.test(on[0]?.textContent || ''), (on[0]?.querySelector('.cupon')?.textContent || 'no pill'));
    LB.renderCup(d, { rows, players, view: 'characters', ch: 'none' });
    cb('nobody is marked with Just math chosen',
      [...d.querySelectorAll('[data-cup-ch]')].every((r) => r.getAttribute('aria-pressed') === 'false'));
    d.remove();
  } catch (e) {
    cb('harness itself', false, 'THREW ' + e.message);
  }
}

/* ------------------------------------------- pressing a friend on the real cup
   Asked for by a first grader: they read the cup, saw Kiwi had the fewest
   badges and wanted to play as Kiwi — and the only picker was in the header,
   two screens up, with nothing connecting it to the row they were looking at.

   Through the real page rather than renderCup, because what is being checked is
   the wiring: the press, theme.js, the redraw that follows, and the header
   picker agreeing with the row. Every one of those is invisible to a pure
   render, and a check that called the renderer would pass with the click
   handler deleted. */
{
  const cb = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('cupswitch:' + n).padEnd(36) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:absolute;left:-99999px;top:0;width:1100px;height:1400px';
  fr.src = '/cup/';
  document.body.appendChild(fr);
  await new Promise((r) => { fr.onload = r; setTimeout(r, 8000); });
  const w = fr.contentWindow, dd = fr.contentDocument;
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    await nap(400);
    const rowFor = (id) => dd.querySelector('[data-cup-ch="' + id + '"]');
    cb('the page renders four friends to press',
      dd.querySelectorAll('[data-cup-ch]').length === 4,
      dd.querySelectorAll('[data-cup-ch]').length + ' rows');

    /* Start from Just math, so the first press is a real change rather than a
       no-op — with kiwi already on, "it is kiwi afterwards" would be true
       whether the press did anything or not. */
    dd.querySelector('.chbtn[data-ch="none"]').click(); await nap(250);
    cb('starting from Just math, nobody is marked',
      [...dd.querySelectorAll('[data-cup-ch]')].every((r) => r.getAttribute('aria-pressed') === 'false'),
      dd.documentElement.dataset.ch);

    rowFor('kiwi').click(); await nap(300);
    cb('pressing a friend plays as them', dd.documentElement.dataset.ch === 'kiwi',
      'data-ch=' + dd.documentElement.dataset.ch);
    cb('the row it was pressed on now reads as on',
      rowFor('kiwi')?.getAttribute('aria-pressed') === 'true');
    cb('and no other row does',
      [...dd.querySelectorAll('[data-cup-ch]')].filter((r) => r.getAttribute('aria-pressed') === 'true').length === 1);
    /* The header picker and the row are two views of one choice. They disagreed
       in the first draft, because the list redrew and the picker did not. */
    cb('the header picker agrees with the row',
      dd.querySelector('.chbtn[data-ch="kiwi"]')?.getAttribute('aria-pressed') === 'true');
    cb('the page is themed, not just labelled',
      !!getComputedStyle(dd.documentElement).getPropertyValue('--a1').trim());
    /* Focus follows the press, or a keyboard reader is dropped at the top of a
       list that changed under them — the rule the view toggle already follows. */
    cb('focus stays on the row that was pressed',
      dd.activeElement === rowFor('kiwi'),
      dd.activeElement?.dataset?.cupCh || dd.activeElement?.tagName);
    cb('the choice is remembered for the next page',
      w.localStorage.getItem('izzimath.character') === 'kiwi',
      w.localStorage.getItem('izzimath.character'));

    // and a second press moves it, rather than only ever adding
    rowFor('flame').click(); await nap(300);
    cb('pressing another friend moves it',
      dd.documentElement.dataset.ch === 'flame'
      && rowFor('kiwi')?.getAttribute('aria-pressed') === 'false'
      && rowFor('flame')?.getAttribute('aria-pressed') === 'true',
      'data-ch=' + dd.documentElement.dataset.ch);
    /* Switching from the HEADER has to redraw the list too, or the page shows
       one friend as on while the site is another. And it must not steal focus
       into the list, which is why the redraw only refocuses its own press. */
    const ashBtn = dd.querySelector('.chbtn[data-ch="ash"]');
    /* Focused first ON PURPOSE. A synthetic click does not move focus, so
       without this the reader's focus is on nothing and "the redraw did not
       steal it" is true however the redraw behaves — the same trap as asserting
       where focus lands after a synthetic Tab. Focusing first is what a real
       press does, and makes the assertion able to fail. */
    ashBtn.focus();
    ashBtn.click(); await nap(300);
    cb('switching in the header updates the rows',
      rowFor('ash')?.getAttribute('aria-pressed') === 'true'
      && rowFor('flame')?.getAttribute('aria-pressed') === 'false',
      'data-ch=' + dd.documentElement.dataset.ch);
    cb('and does not snatch focus into the list',
      dd.activeElement === ashBtn && !dd.querySelector('[data-cup]').contains(dd.activeElement),
      dd.activeElement === ashBtn ? 'the header button'
        : dd.activeElement?.dataset?.cupCh ? dd.activeElement.dataset.cupCh + "'s ROW in the list"
        : (dd.activeElement?.tagName || 'nothing'));
    /* The instruction. The rows looked exactly like rows before, so without a
       line saying they can be pressed the control is invisible. */
    cb('the page says the rows can be pressed',
      /[Tt]ap a friend/.test(dd.querySelector('.cuppick')?.textContent || ''),
      dd.querySelector('.cuppick')?.textContent?.slice(0, 48) || 'nothing said');
  } catch (e) {
    cb('harness itself', false, 'THREW ' + e.message);
  }
  fr.remove();
}

L.push(''); L.push('CHECKS_RUN='+checks);
document.getElementById('out').textContent=L.join('\n');
window.__DONE__=true;
</script></body></html>
