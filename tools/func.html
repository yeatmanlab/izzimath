<!DOCTYPE html><html><head><meta charset="utf-8"><title>problem type test</title>
<link rel="stylesheet" href="/assets/src/styles/site.css">
<style>body{background:#0A0D1C;color:#EAF0FF;font:11px/1.6 monospace;padding:10px}pre{white-space:pre-wrap}</style>
</head><body>
<div id="host" style="position:absolute;left:-99999px;top:0;width:820px"></div>
<pre id="out">…</pre>
<script type="module">
// Exercises every problem type end to end: does it render, is it interactive,
// does its own stated answer verify, does it have a worked explanation, and does
// it render on paper both as a sheet and as a key.
const [S,A,C,R,RD,T,F,P,BG]=await Promise.all([
  import('/assets/src/lib/sprites.js'),
  import('/assets/content/activities/index.js'),
  import('/assets/content/characters.js'),
  import('/assets/src/lib/rng.js'),
  import('/assets/src/engine/render.js'),
  import('/assets/content/types.js'),
  import('/assets/src/lib/frac.js'),
  import('/assets/src/lib/printsheet.js'),
  import('/assets/content/badges.js'),
]);
document.body.insertAdjacentHTML('afterbegin', S.SPRITES);
document.documentElement.dataset.ch='kiwi';
const host=document.getElementById('host'); const L=[]; let checks=0;

const samples={};
for(const a of A.activities){
  const n=a.pages??a.rounds??10;
  for(let i=0;i<n;i++){
    const sd=R.deriveSeed(8817,'p'+i);
    let p; try{ p=a.generate(sd,i,C.getCharacter('kiwi'),R.rng(sd),8817); }catch(e){ continue; }
    /* One sample per type was one sample too few. `bond` is claimed by
       number-friends (Kindergarten, whole numbers), so a fraction bond's render,
       print and key paths would report green while never being rendered at all —
       and the same for a bare-ticked number line or a fraction input. Key by the
       variations that take different code paths. */
    const variant=[
      p.type,
      p.accept||'',
      p.type==='bond' && [p.whole,p.a,p.b].some(v=>String(v).includes('/')) ? 'frac':'',
      p.type==='numberline' && Array.isArray(p.ticks) && p.ticks.length===0 ? 'bare':'',
      p.printVisual?'vis':'', p.printWide?'wide':'', p.printKeyWorking?'kw':'',
    ].filter(Boolean).join('|');
    if(!samples[variant]) samples[variant]={p,from:a.id,variant};
  }
}
const correctResponse=(p)=>({
  choice:String(p.answer), input:String(p.answer), compare:p.answer, truefalse:p.answer,
  numberline:p.target, tap:p.answer??p.n, ordinal:p.answer??p.n, bond:p.answer, boardmove:p.answer,
}[p.type]);

/* Walk the SAMPLES, not the type list: there is now more than one sample per
   type. The per-type guard stays, as its own assertion. */
const sampleList=Object.values(samples);
for(const t of T.TYPES){
  checks++;
  if(!sampleList.some(s=>s.p.type===t)) L.push('✗ '+t.padEnd(11)+'NO SAMPLE in any activity');
}
for(const s of sampleList){
  const {p,from,variant}=s; const t=p.type; checks++;
  const slot=document.createElement('div'); host.innerHTML=''; host.appendChild(slot);
  RD.renderProblem(slot,p,()=>{});
  const rendered=slot.children.length>0;
  const controls=slot.querySelectorAll('button,input,[role="slider"]').length;
  const own=correctResponse(p);
  let ownOk;
  if(t==='input'&&p.accept==='fraction'){
    const g=F.parseAnswer(String(own)),w=F.parseAnswer(String(p.answer));
    ownOk=!!(g&&w&&F.cmpF(g,w)===0);
  } else ownOk=T.isCorrect(p,own);
  const ok=rendered&&controls>0&&ownOk===true&&!!p.explain;
  L.push((ok?'· ':'✗ ')+variant.padEnd(20)+'from '+from.padEnd(22)
    +'rendered:'+(rendered?'y':'N')+' controls:'+String(controls).padStart(2)
    +' ownAnswerOK:'+(ownOk===true?'y':String(ownOk))+' explain:'+(p.explain?'y':'N'));
}
L.push('');
for(const s of sampleList){
  const t=s.variant; checks++;
  let sheetOk=false,keyOk=false;
  try{
    const h=P.printProblem(s.p,0,{key:false}), k=P.printProblem(s.p,0,{key:true});
    sheetOk=h.length>20&&!/undefined|NaN/.test(h);
    keyOk=k.length>20&&!/undefined|NaN/.test(k);
  }catch(e){ L.push('  print '+t+' THREW '+e.message); }
  L.push((sheetOk&&keyOk?'· ':'✗ ')+('print:'+t).padEnd(22)+'sheet:'+(sheetOk?'y':'N')+' key:'+(keyOk?'y':'N'));
}

/* ------------------------------------------------------------------ profiles
   The profile panel is rendered on the client, so the static accessibility
   checker never sees it. Driven here through a REAL page in an iframe rather
   than by importing the module, because what matters is the thing a child
   touches: the button in the header, the dialog it opens, and the keyboard.

   Every assertion below is a defect this found or would find. Two were real:
   closing the dialog dropped focus at the top of the document, and Tab walked
   straight out of a dialog marked aria-modal. */
/* -------------------------------------------------------- print page controls
   The action row had grown to eleven controls, two of which were identical -/+
   steppers distinguished only by the words "page" and "sheet" — a difference
   that needed a paragraph of prose to explain. These guard the shape it was
   rebuilt into: a small primary row, one amount control, and everything that
   modifies the sheet behind a disclosure with its state visible. */
L.push('');
{
  const frame2 = document.createElement('iframe');
  frame2.style.cssText = 'position:absolute;left:-99999px;top:0;width:1100px;height:900px';
  frame2.src = '/print/carry-and-borrow/';
  document.body.appendChild(frame2);
  await new Promise((r) => { frame2.onload = r; setTimeout(r, 8000); });
  const sleep2 = (ms) => new Promise((r) => setTimeout(r, ms));
  await sleep2(500);
  const d2 = frame2.contentDocument, w2 = frame2.contentWindow;
  const pc = (name, pass, note = '') => { checks++; L.push((pass ? '· ' : '✗ ') + ('printui:' + name).padEnd(30) + (note || (pass ? 'ok' : 'FAILED'))); };
  try {
    const row = d2.querySelector('.prow');
    const primary = [...row.querySelectorAll('button, a, select')];
    pc('primary row is small', primary.length <= 5, primary.length + ' controls (was 11)');
    pc('one amount control', d2.querySelectorAll('[data-amount]').length === 1);
    pc('no bare +/- steppers', !d2.querySelector('[data-pages-up], [data-pack-up]'));
    pc('options start collapsed', !d2.querySelector('.opts').open);
    pc('amount groups its options', d2.querySelectorAll('[data-amount] optgroup').length >= 1);

    // state must be VISIBLE, which a verb-labelled button never was
    d2.querySelector('.opts').open = true; await sleep2(150);
    const on = d2.querySelector('.seg input:checked + span');
    const off = d2.querySelector('.seg input:not(:checked) + span');
    pc('selected segment looks selected',
      w2.getComputedStyle(on).backgroundImage !== w2.getComputedStyle(off).backgroundImage);
    pc('every option group is labelled',
      [...d2.querySelectorAll('.optgrid fieldset')].every((f) => !!f.querySelector('legend')?.textContent.trim()));

    // touch targets, since these are used one-handed
    const small = [...d2.querySelectorAll('.prow button, .prow a, .prow select, .seg span, .optcheck input')]
      .filter((e) => e.getBoundingClientRect().height < 24);
    pc('all controls clear 24px', small.length === 0, small.length ? small.length + ' too small' : 'ok');

    // the amount control must actually change the output, and say so
    const sel = d2.querySelector('[data-amount]');
    sel.value = 'p3'; sel.dispatchEvent(new w2.Event('change', { bubbles: true }));
    await sleep2(400);
    pc('3 pages renders 3 pages', d2.querySelectorAll('[data-sheet] .sheet').length === 3);
    pc('summary states the outcome', /3 sheets of paper/.test(d2.querySelector('[data-total]')?.textContent || ''),
      '"' + (d2.querySelector('[data-total]')?.textContent || '') + '"');
    sel.value = 'k5'; sel.dispatchEvent(new w2.Event('change', { bubbles: true }));
    await sleep2(500);
    pc('pack of 5 renders 5 sheets', d2.querySelectorAll('[data-sheet] .sheet').length === 5);

    /* Review is a fixed short sheet by design, so it cannot be made longer — and
       the summary must not claim otherwise. Choosing review while three pages
       were selected left the line reading "39 problems on 3 sheets of paper"
       above a single eight-problem page. The length is parked and restored, and
       the clamp has to run BEFORE the render or the select and the sheet
       disagree — which is exactly what the first fix did. */
    d2.querySelector('.opts').open = true; await sleep2(120);
    const setMode = (v) => { const r = [...d2.querySelectorAll('[data-mode-radio]')].find((x) => x.value === v);
      r.checked = true; r.dispatchEvent(new w2.Event('change', { bubbles: true })); };
    const agrees = () => {
      const m = (d2.querySelector('[data-total]')?.textContent || '').match(/on (\d+) sheet/);
      return m ? +m[1] === d2.querySelectorAll('[data-sheet] .sheet').length : false;
    };
    sel.value = 'p3'; sel.dispatchEvent(new w2.Event('change', { bubbles: true })); await sleep2(400);
    pc('summary agrees at 3 pages', agrees(), d2.querySelector('[data-total]')?.textContent);
    setMode('review'); await sleep2(420);
    pc('review clamps to one page', d2.querySelectorAll('[data-sheet] .sheet').length === 1);
    pc('summary agrees in review', agrees(), d2.querySelector('[data-total]')?.textContent);
    /* And the CONTROL has to agree too. Asserting only summary-against-sheets was
       too weak: the summary and the render can both be right while the select
       still reads "3 pages" over a one-page review sheet. Caught by breaking the
       clamp on purpose and watching every other check pass. */
    pc('control agrees in review', sel.value === 'p1', 'select reads "' + sel.value + '"');
    pc('longer sheet unavailable in review',
      d2.querySelector('[data-amount] optgroup[data-longer]')?.disabled === true);
    setMode('practice'); await sleep2(450);
    pc('length comes back after review', d2.querySelectorAll('[data-sheet] .sheet').length === 3,
      d2.querySelectorAll('[data-sheet] .sheet').length + ' pages');
    pc('control agrees after review', sel.value === 'p3', 'select reads "' + sel.value + '"');
    pc('summary agrees again', agrees(), d2.querySelector('[data-total]')?.textContent);

    // and a grade-1 activity must not offer a longer sheet at all
    const f3 = document.createElement('iframe');
    f3.style.cssText = frame2.style.cssText;
    f3.src = '/print/make-ten-race/';
    document.body.appendChild(f3);
    await new Promise((r) => { f3.onload = r; setTimeout(r, 8000); });
    await sleep2(400);
    const opts3 = [...f3.contentDocument.querySelectorAll('[data-amount] option')].map((o) => o.value);
    pc('grade 1 offers no longer sheet', !opts3.some((v) => /^p[2-9]/.test(v)), opts3.join(','));
    f3.remove();
  } catch (e) {
    pc('harness', false, 'THREW ' + e.message);
  }
  frame2.remove();
}

/* ------------------------------------------------------------- number line
   A third grader could not tell what Number Line Hop wanted, so these guard the
   cues that were missing. All of them are things the old version failed. */
L.push('');
{
  const A2 = A.activities.find((x) => x.id === 'number-line-hop');
  const sd = R.deriveSeed(4242, 'r0');
  const prob = A2.generate(sd, 0, C.getCharacter('kiwi'), R.rng(sd), 4242);
  host.innerHTML = '';
  const w = RD.renderProblem(host, prob, () => {});
  const svg = host.querySelector('svg[role="slider"]');
  const nl = (name, pass, note = '') => { checks++; L.push((pass ? '· ' : '✗ ') + ('numberline:' + name).padEnd(30) + (note || (pass ? 'ok' : 'FAILED'))); };

  const pill = svg?.querySelector('.knob text');
  nl('token carries the number', pill?.textContent === String(prob.targetLabel ?? prob.target),
    '"' + (pill?.textContent ?? '') + '" vs target ' + prob.target);
  nl('token parks off the answer', Math.abs(parseFloat(svg.querySelector('.knob rect').getAttribute('x')) - 0) < 80,
    'parked left, not at the midpoint');
  nl('shows a travel track', !!svg?.querySelector('.track'));
  nl('shows grab arrows', !!svg?.querySelector('.grip'));
  nl('readout blank before moving', (svg?.querySelector('.rdout')?.textContent || '') === '');
  nl('names both ways in', /tap the line/i.test(host.querySelector('.nlhow')?.textContent || ''));
  nl('button names the number', new RegExp('Put\\s+' + String(prob.targetLabel ?? prob.target)).test(
    host.querySelector('.ansrow button')?.textContent || ''),
    '"' + (host.querySelector('.ansrow button')?.textContent || '') + '"');
  // pressing before moving must teach, not submit
  host.querySelector('.ansrow button').click();
  nl('press before moving teaches', !svg.dataset.locked && /Move the/i.test(host.querySelector('.nlhow')?.textContent || ''));
  // integer lines must not show a decimal readout mid-drag
  nl('integer line reads whole numbers', !/\./.test(svg.querySelector('.rdout')?.textContent || '0'));
  host.innerHTML = '';

  /* And the generator must consult the rng. It used to pick purely by index, so
     a held ladder rung asked the same question every round. */
  for (const id of ['number-line-hop', 'hundred-line-hop', 'mixed-number-line']) {
    const act = A.activities.find((x) => x.id === id);
    const seen = new Set();
    for (let k = 0; k < 12; k++) {
      const s2 = R.deriveSeed(4242, 'r' + k);
      seen.add(String(act.generate(s2, 0, C.getCharacter('kiwi'), R.rng(s2), 4242).targetLabel));
    }
    nl(id + ' varies at one rung', seen.size >= 3, seen.size + ' distinct in 12 rounds at rung 0');
  }
}

L.push('');
{
  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:absolute;left:-99999px;top:0;width:1100px;height:900px';
  frame.src = '/games/decade-duel/';
  document.body.appendChild(frame);
  await new Promise((r) => { frame.onload = r; setTimeout(r, 8000); });
  const w = frame.contentWindow, d = frame.contentDocument;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const t = (name, pass, note = '') => { checks++; L.push((pass ? '· ' : '✗ ') + ('profile:' + name).padEnd(30) + (note || (pass ? 'ok' : 'FAILED'))); };

  try {
    w.localStorage.removeItem('izzi.profiles.v1');
    w.sessionStorage.clear();
    // Repaint explicitly rather than sleeping and hoping: the module's own paint
    // races with this clear, and a check that depends on which wins is a check
    // that fails at random.
    w.__izziProfile.repaint();
    await sleep(200);

    const btn = d.querySelector('[data-me]');
    t('button in header', !!btn);
    t('button says Scores when off', d.querySelector('[data-me-name]')?.textContent === 'Scores');
    t('button is a real button', btn?.tagName === 'BUTTON' && !!btn.getAttribute('aria-label'));
    t('button tap target >= 24px', (btn?.getBoundingClientRect().height ?? 0) >= 24,
      Math.round(btn?.getBoundingClientRect().height ?? 0) + 'px');

    btn.click(); await sleep(200);
    const dlg = d.querySelector('.mepanel');
    t('opens a dialog', !!dlg);
    t('role=dialog + aria-modal', dlg?.getAttribute('role') === 'dialog' && dlg?.getAttribute('aria-modal') === 'true');
    t('dialog has a label', !!dlg?.getAttribute('aria-label'));
    t('panel is not printed', !!d.querySelector('.mewrap.noprint'));
    t('focus moved into dialog', !!dlg?.contains(d.activeElement), d.activeElement?.textContent?.trim().slice(0, 24));

    /* Tab must not walk out of a dialog that claims to be modal.

       Asserting on defaultPrevented, NOT on where focus ended up: a browser does
       not move focus in response to a synthetic Tab event, so "focus is still
       inside" is true whether the trap works or not. The first version of this
       check asserted exactly that and could not fail — caught by breaking the
       trap on purpose and watching it pass. */
    const items = [...dlg.querySelectorAll('button, [href]')].filter((e) => e.offsetParent !== null);
    items[items.length - 1].focus();
    const fwd = new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true });
    d.dispatchEvent(fwd);
    items[0].focus();
    const back = new w.KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, bubbles: true, cancelable: true });
    d.dispatchEvent(back);
    await sleep(60);
    t('Tab wraps at the last item', fwd.defaultPrevented);
    t('Shift-Tab wraps at the first', back.defaultPrevented);
    t('focus stayed inside the dialog', !!d.querySelector('.mepanel')?.contains(d.activeElement));

    // Escape closes, and focus goes back where it came from
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(150);
    t('Escape closes', !d.querySelector('.mepanel'));
    t('focus returns to the button', d.activeElement === d.querySelector('[data-me]'),
      d.activeElement?.getAttribute?.('data-me') !== null ? 'the Scores button' : (d.activeElement?.tagName || 'nothing'));

    // the create flow, and every face labelled
    d.querySelector('[data-me]').click(); await sleep(150);
    d.querySelector('[data-new]').click(); await sleep(250);
    const cells = [...d.querySelectorAll('[data-av]')];
    t('offers all 150 faces', cells.length === 150, cells.length + ' faces');
    t('every face is labelled', cells.every((c) => !!c.getAttribute('aria-label')));
    t('every face svg is decorative', cells.every((c) => c.querySelector('svg')?.getAttribute('aria-hidden') === 'true'));
    t('faces are >= 24px', cells[0].getBoundingClientRect().height >= 24,
      Math.round(cells[0].getBoundingClientRect().height) + 'px');

    cells[42].click(); await sleep(180);
    t('offers 10 names', d.querySelectorAll('[data-name]').length === 10);
    d.querySelectorAll('[data-name]')[0].click(); await sleep(180);
    /* All 500 snacks in one scrolling list. Two things it must not do: grow the
       panel until the warning is off the top, or put 500 stops in the tab order. */
    const flist = d.querySelector('[data-foodlist]');
    const fbtns = [...d.querySelectorAll('[data-food]')];
    t('every snack is on the page', fbtns.length === 500, fbtns.length + ' shown');
    t('no reshuffle button left', !d.querySelector('[data-shuffle]'));
    t('the list scrolls', flist.scrollHeight > flist.clientHeight + 20,
      flist.scrollHeight + ' > ' + flist.clientHeight);
    t('the list, not the panel, owns the scroll',
      flist.getBoundingClientRect().height <= d.querySelector('.mepanel').getBoundingClientRect().height,
      Math.round(flist.getBoundingClientRect().height) + 'px of '
      + Math.round(d.querySelector('.mepanel').getBoundingClientRect().height) + 'px panel');
    /* The warning is the whole point of this screen; 500 buttons must not push it
       out of view the way they would if the panel simply grew. */
    t('the warning stays visible', (() => {
      const box = d.querySelector('.mepanel').getBoundingClientRect();
      const warn = d.querySelector('.mesub').getBoundingClientRect();
      return warn.top >= box.top - 1 && warn.bottom <= box.bottom + 1;
    })());
    t('the way back is reachable without scrolling the list',
      !!d.querySelector('[data-back]'));
    // one tab stop, and arrows move inside the list
    t('exactly one snack is tabbable', fbtns.filter((b) => b.tabIndex === 0).length === 1,
      fbtns.filter((b) => b.tabIndex === 0).length + ' tabbable');
    fbtns[0].focus();
    flist.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
    await sleep(60);
    t('arrow keys move inside the list', d.activeElement === fbtns[1],
      d.activeElement?.textContent?.trim());
    t('and the tab stop travels with focus',
      fbtns[1].tabIndex === 0 && fbtns[0].tabIndex === -1);
    flist.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'End', bubbles: true, cancelable: true }));
    await sleep(60);
    t('End reaches the last snack', d.activeElement === fbtns[fbtns.length - 1],
      d.activeElement?.textContent?.trim());
    /* The warning has to state the CONSEQUENCE, not just say "remember it". This
       is the only thing a child carries between visits and there is no recovery. */
    const warn = d.querySelector('.mesub')?.textContent || '';
    t('the snack screen says it must be remembered', /have to remember/i.test(warn));
    t('and says what happens otherwise', /only way back/i.test(warn) && /look it up/i.test(warn), warn.slice(0, 60));
    t('grown-ups note is honest', /not a password/.test(d.querySelector('.mefoot')?.textContent || '')
      && /no way to recover/.test(d.querySelector('.mefoot')?.textContent || ''));
    t('a section heading names each half',
      d.querySelectorAll('.mefoodsec').length === 2,
      [...d.querySelectorAll('.mefoodsec')].map((e) => e.textContent).join(' / '));

    // a silly one, so the same-kind decoy rule is exercised on the way back in
    const mine = fbtns.find((b) => b.dataset.food.includes('-')).dataset.food;
    d.querySelector('[data-food="' + mine + '"]').click(); await sleep(350);
    t('profile created', d.querySelector('[data-me-name]')?.textContent !== 'Scores',
      'button now says "' + d.querySelector('[data-me-name]')?.textContent + '"');
    t('the snack is repeated back to be remembered',
      new RegExp('Remember').test(d.querySelector('.mesub')?.textContent || ''),
      (d.querySelector('.mesub')?.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 70));

    // the pick-up check must actually reject a wrong answer
    await w.__izziProfile.store.signOut();
    w.__izziProfile.repaint(); await sleep(200);
    d.querySelector('.meclose')?.click(); await sleep(120);
    d.querySelector('[data-me]').click(); await sleep(180);
    d.querySelector('[data-pick]').click(); await sleep(180);
    d.querySelector('[data-id]').click(); await sleep(180);
    const foods = [...d.querySelectorAll('[data-food]')].map((b) => b.dataset.food);
    t('check offers 6 foods incl. the right one', foods.length === 6 && foods.includes(mine), foods.join(','));
    /* The answer must not be the odd one out. The pool is 390 silly to 110 plain,
       so decoys drawn at random would leave a plain answer alone among silly ones
       and the child could pass without remembering anything. */
    t('every choice is the same kind of snack',
      new Set(foods.map((f) => f.includes('-'))).size === 1, foods.join(','));
    d.querySelector('[data-food="' + foods.find((f) => f !== mine) + '"]').click(); await sleep(180);
    t('wrong snack is rejected', d.querySelector('[data-me-name]')?.textContent === 'Scores' && !!d.querySelector('.mesub.bad'));
    d.querySelector('[data-food="' + mine + '"]').click(); await sleep(300);
    t('right snack signs in', d.querySelector('[data-me-name]')?.textContent !== 'Scores');

    /* A game played at the LOWEST tier must still show a score. `bestTier` of 0
       is a real answer, not a missing one, and testing it for truthiness left a
       child who played and stayed on the first rung looking at an empty cell —
       which reads as "that didn't count". Found by playing it, not by reading. */
    {
      const me = await w.__izziProfile.store.getActive();
      await w.__izziProfile.store.record(me.id, 'decade-duel', { played: true, right: 0, streak: 0, tier: 0 });
      d.querySelector('.meclose')?.click(); await sleep(120);
      d.querySelector('[data-me]').click(); await sleep(300);
      const row = [...d.querySelectorAll('.metable tbody tr')]
        .find((r) => /Decade Duel/.test(r.cells[0]?.textContent || ''));
      const cell = row?.cells[1]?.textContent.trim();
      t('tier 0 still shows a score', !!cell, cell ? '"' + cell + '"' : 'EMPTY CELL');
      d.querySelector('.meclose')?.click(); await sleep(120);
    }

    /* Badges. The design rule is that a badge states a fact about a real
       accomplishment, so the checks here are about the moment of earning: it
       fires once, it celebrates, it accounts for everything earned, and the
       shelf agrees with the store. */
    {
      await w.__izziProfile.store.signOut();
      w.localStorage.removeItem('izzi.profiles.v1');
      d.querySelector('.meclose')?.click(); await sleep(120);
      w.__izziProfile.repaint(); await sleep(200);
      d.querySelector('[data-me]').click(); await sleep(250);
      d.querySelector('[data-new]').click(); await sleep(320);
      d.querySelector('[data-av="7"]').click(); await sleep(200);
      d.querySelectorAll('[data-name]')[0].click(); await sleep(200);
      d.querySelector('[data-food]').click(); await sleep(420);   // whatever the tray offers
      d.querySelector('.meclose')?.click(); await sleep(150);

      const me = await w.__izziProfile.store.getActive();
      t('no badges on a new profile', (await w.__izziProfile.store.listBadges(me.id)).length === 0);

      /* Pick a character first. A level-up dresses the CHARACTER, so with Just
         math selected there is nobody to dress and no line to announce — correct
         behaviour, and it made this check unfalsifiable until the harness chose
         one. */
      d.querySelector('.chbtn[data-ch="kiwi"]').click(); await sleep(220);
      // a real accomplishment earns badges and celebrates
      await w.__izziProfile.noteProgress('decade-duel', { played: true, right: 16, streak: 16, tier: 3 });
      await sleep(600);
      const held = await w.__izziProfile.store.listBadges(me.id);
      t('accomplishment earns badges', held.length >= 3, held.length + ' earned');
      t('records which character was there', held.every((b) => !!b.earnedWith));
      const pop = d.querySelector('.bdpop');
      t('the character celebrates', !!pop && !!pop.querySelector('.celebrate'));
      const lvSaid = (pop?.querySelector('.bdpop-lv')?.textContent || '').replace(/\s+/g, ' ').trim();
      /* The celebration must not bury the maths. Three cards plus "and N more"
         plus a level line measured 708px on an 844px phone — 84% of the screen.
         SHOWN scales with the viewport now; this stops it drifting back. */
      t('the celebration leaves the maths visible', (() => {
        const box = d.querySelector('.bdpop');
        if (!box) return false;
        return box.getBoundingClientRect().height <= w.innerHeight * 0.7;
      })(), (() => {
        const box = d.querySelector('.bdpop');
        return box ? Math.round(box.getBoundingClientRect().height / w.innerHeight * 100) + '% of the frame' : 'no card';
      })());
      const cards = pop ? pop.querySelectorAll('.bdpop-name').length : 0;
      const moreTxt = pop?.querySelector('.bdpop-more')?.textContent || '';
      const moreN = parseInt((moreTxt.match(/and (\d+) more/) || [])[1] || '0', 10);
      t('every earned badge is accounted for', cards + moreN === held.length,
        cards + ' shown + ' + moreN + ' more = ' + held.length);
      t('badge says what was done, not well done',
        !/great|well done|awesome|good job/i.test(pop?.textContent || ''));

      // earning is once only — no repeat celebration for the same badge
      pop?.remove();
      await w.__izziProfile.noteProgress('decade-duel', { played: true, right: 16, streak: 16, tier: 3 });
      await sleep(500);
      t('does not re-award', (await w.__izziProfile.store.listBadges(me.id)).length === held.length);
      t('does not re-celebrate', !d.querySelector('.bdpop'));

      /* Character levels. The gear is driven by one attribute on <html>, so
         these check that attribute and the header title — the sprites and the
         CSS rules are checked in check.mjs. */
      t('a level shows once enough badges are earned',
        d.documentElement.dataset.lv === '1', 'data-lv=' + d.documentElement.dataset.lv
        + ' at ' + held.length + ' badges');
      t('the level title rides with the count',
        /Explorer/.test(d.querySelector('[data-me-name]')?.textContent || ''),
        d.querySelector('[data-me-name]')?.textContent);
      t('the gear layers are in every character avatar', (() => {
        const chb = d.querySelector('.chbtn[data-ch="kiwi"] svg');
        return chb && chb.querySelectorAll('use.gear').length === 4;
      })());
      t('Just math never wears gear', (() => {
        const none = d.querySelector('.chbtn[data-ch="none"] svg');
        return none && none.querySelectorAll('use.gear').length === 0;
      })());
      t('the level-up was announced on the badge card', lvSaid,
        lvSaid || '(no level line seen)');

      // the shelf and the store agree, and the count reaches the header
      d.querySelector('[data-me]').click(); await sleep(350);
      const box = d.querySelector('.mepanel');
      const strip = d.querySelector('.bdstrip');
      const all = d.querySelector('.bdall');
      const near = d.querySelector('.bdnext + .bdstrip');
      t('earned badges show as a strip',
        strip?.querySelectorAll('.bdcell.got').length === held.length,
        strip?.querySelectorAll('.bdcell.got').length + ' vs ' + held.length + ' held');
      t('the whole set is behind a disclosure', !!all && !all.open);
      t('the whole set lights exactly what is held',
        all?.querySelectorAll('.bdcell.got').length === held.length);
      /* The stated count and the rendered count must agree. A summary that
         disagreed with what it summarised is the bug that shipped on the print
         page ("39 problems on 3 sheets" over one 8-item page). */
      const label = d.querySelector('.bdshelf-h span')?.textContent || '';
      const [saidGot, saidAll] = label.match(/(\d+) of (\d+)/)?.slice(1).map(Number) || [];
      t('the count says what is shown', saidGot === held.length
        && saidAll === all?.querySelectorAll('.bdcell').length,
        label + ' vs ' + held.length + '/' + all?.querySelectorAll('.bdcell').length);
      t('close-by badges are all unearned', !!near
        && near.querySelectorAll('.bdcell').length > 0
        && near.querySelectorAll('.bdcell.got').length === 0);
      t('shelf shows the gaps too', d.querySelectorAll('.bd-locked').length > 0);
      /* This panel is mostly something to READ, so it must open at the top. It
         used to focus the first real control — two thirds of the way down — and
         the browser scrolled the greeting, including the snack the child needs
         to come back, clean off the top of the panel. */
      t('focus is the panel, not a buried control', d.activeElement === box,
        d.activeElement?.className || d.activeElement?.tagName);
      // and Tab still cannot leave: focus starts on the container, not a control
      const esc = new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true });
      box.dispatchEvent(esc);
      t('Tab from the panel stays inside', box.contains(d.activeElement));
      t('count reaches the header', /\d+★/.test(d.querySelector('[data-me-name]')?.textContent || ''),
        d.querySelector('[data-me-name]')?.textContent);
      d.querySelector('.meclose')?.click(); await sleep(120);

      /* The scroll half of the bug only appears when the panel cannot fit: the
         browser scrolls a focused control into view, and anything above it goes
         off the top. This harness runs in a 3000px-tall frame where the panel
         always fits, so asserting scrollTop there passes no matter what. Cap the
         height and make the condition real. */
      const cap = d.createElement('style');
      cap.textContent = '.mepanel{max-height:240px}';
      d.head.appendChild(cap);
      d.querySelector('[data-me]').click(); await sleep(350);
      const cbox = d.querySelector('.mepanel');
      t('a panel too tall to fit still scrolls', cbox.scrollHeight > cbox.clientHeight,
        cbox.scrollHeight + ' > ' + cbox.clientHeight);
      t('a cramped panel opens at the top', cbox.scrollTop === 0, 'scrollTop ' + cbox.scrollTop);
      t('the greeting stays above the fold', (() => {
        const h = d.querySelector('.meh');
        return h.getBoundingClientRect().top >= cbox.getBoundingClientRect().top - 1;
      })());
      cap.remove();
      d.querySelector('.meclose')?.click(); await sleep(120);
    }

    /* Unwritable storage must be REPORTED, not faked. In Safari private
       browsing, with site data off, or on a full quota, setItem throws — and the
       first build walked a child through all three screens, said "Hello,
       Noodle!", and lost the profile the moment anything re-read storage. */
    {
      const realSet = w.localStorage.setItem.bind(w.localStorage);
      const brick = () => Object.defineProperty(w.localStorage, 'setItem',
        { configurable: true, value: () => { throw new w.DOMException('QuotaExceededError'); } });
      const unbrick = () => Object.defineProperty(w.localStorage, 'setItem',
        { configurable: true, value: realSet });

      await w.__izziProfile.store.signOut();
      d.querySelector('.meclose')?.click(); await sleep(120);
      brick(); w.__izziProfile.repaint(); await sleep(200);
      d.querySelector('[data-me]').click(); await sleep(300);
      const upfront = d.querySelector('.meh')?.textContent || '';
      t('blocked storage is reported up front', /cannot be saved/i.test(upfront), '"' + upfront.slice(0, 40) + '"');
      t('does not offer the flow it cannot finish', !d.querySelector('[data-new]'));

      // and if it breaks mid-flow, after the probe passed
      unbrick(); w.__izziProfile.repaint(); await sleep(150);
      d.querySelector('.meclose')?.click(); await sleep(120);
      d.querySelector('[data-me]').click(); await sleep(250);
      d.querySelector('[data-new]').click(); await sleep(300);
      d.querySelector('[data-av="12"]').click(); await sleep(220);
      d.querySelectorAll('[data-name]')[0].click(); await sleep(220);
      brick();
      d.querySelector('[data-food]').click(); await sleep(450);   // whatever the tray offers
      const mid = d.querySelector('.meh')?.textContent || '';
      t('mid-flow failure is not faked', !/^Hello,/.test(mid), '"' + mid.slice(0, 40) + '"');
      unbrick(); d.querySelector('.meclose')?.click(); await sleep(120);
      w.__izziProfile.repaint(); await sleep(150);
    }

    /* Nothing may be written while signed out. Counting docs before and after,
       rather than asserting something that is true either way — the first
       version of this check had `|| true` on the end and could not fail. */
    await w.__izziProfile.store.signOut();
    const keysBefore = Object.keys(JSON.parse(w.localStorage.getItem('izzi.profiles.v1') || '{}')).length;
    await w.__izziProfile.noteProgress('array-architect', { played: true });
    await sleep(80);
    const keysAfter = Object.keys(JSON.parse(w.localStorage.getItem('izzi.profiles.v1') || '{}')).length;
    t('no writes while signed out', keysAfter === keysBefore, keysBefore + ' docs before, ' + keysAfter + ' after');
  } catch (e) {
    t('harness itself', false, 'THREW ' + e.message);
  }
  frame.remove();
}

/* ----------------------------------------------- submitting versus moving on
   "Check" and "Next" were both .btn.pri, so nothing on the page said which one
   recorded an answer. Next never submitted — it only turned the page, and the
   question was then silently not counted at the end. These guard the three
   things that fixed it: one unmistakable submit button, a way past that says
   Skip and is not primary, and a skip that announces itself. */
L.push('');
{
  const bf = document.createElement('iframe');
  bf.style.cssText = 'position:absolute;left:-99999px;top:0;width:1000px;height:1100px';
  bf.src = '/books/tens-and-ones/?seed=8817';
  document.body.appendChild(bf);
  await new Promise((r) => { bf.onload = r; setTimeout(r, 8000); });
  const bd = bf.contentDocument, bw = bf.contentWindow;
  const bc = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('book:' + n).padEnd(30) + (note ? '  ' + note : '  ok')); };
  // the sleeps above are scoped to their own blocks
  const nap = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    await nap(500);
    const fwd = () => bd.querySelector('.sfoot.qnav [data-next], .sfoot.qnav [data-finish]');

    // one submit button, and it is the ONLY primary-weight thing on the page
    bc('one submit button', bd.querySelectorAll('.btn.go').length === 1);
    bc('submit is wider than the way past', (() => {
      const go = bd.querySelector('.btn.go').getBoundingClientRect();
      return go.width > fwd().getBoundingClientRect().width * 2;
    })(), Math.round(bd.querySelector('.btn.go').getBoundingClientRect().width) + 'px vs '
      + Math.round(fwd().getBoundingClientRect().width) + 'px');
    bc('nothing else claims primary weight',
      bd.querySelectorAll('.sfoot.qnav .btn.pri').length === 0);
    bc('the way past says Skip, not Next', /Skip/.test(fwd().textContent), fwd().textContent.trim());

    /* `hidden` must actually hide: .fb sets display:inline-flex, which beats the
       browser's own [hidden]{display:none}, so the answer box's hidden "Type an
       answer first" rendered as a small empty capsule under every question. */
    bc('hidden elements have no box', [...bd.querySelectorAll('[hidden]')]
      .every((e) => e.getBoundingClientRect().height === 0),
      bd.querySelectorAll('[hidden]').length + ' hidden');

    // skipping announces itself, names the question, and offers the way back
    fwd().click(); await nap(350);
    const note = bd.querySelector('.skipnote');
    bc('skipping says so', !!note, (note?.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 52));
    bc('it names the question left behind', /Question 1\b/.test(note?.textContent || ''));
    bc('and says nothing was recorded', /no answer was recorded/i.test(note?.textContent || ''));
    bc('it offers the way back', !!note?.querySelector('[data-backto]'));
    note.querySelector('[data-backto]').click(); await nap(350);
    bc('the way back returns to it', /Question 1\b/.test(bd.querySelector('.qnum')?.textContent || ''),
      bd.querySelector('.qnum')?.textContent);

    // answering promotes the forward button instead
    const inp = bd.querySelector('input.ans');
    inp.value = '31';
    bd.querySelector('.btn.go').click(); await nap(350);
    bc('answering changes the way past to Next', /Next/.test(fwd().textContent), fwd().textContent.trim());
    bc('and makes it the primary action', fwd().classList.contains('pri'));

    /* An answered question must stop counting as skipped. Without clearing it,
       the finish screen reported a skip the child had gone back and done. */
    bc('a question done later is no longer skipped',
      !/was skipped/.test(bd.querySelector('.skipnote')?.textContent || ''));
  } catch (e) {
    bc('harness itself', false, 'THREW ' + e.message);
  }
  bf.remove();
}

/* -------------------------------------------------- the tour, driven for real
   Three panels, two of them a press. The mechanic is that pressing the REAL
   control is what advances it, so these assert on that rather than on copy:
   no Next until something has been pressed, the site actually changes behind
   the dialog, and the last panel names the features it claims to. */
L.push('');
{
  const tf = document.createElement('iframe');
  tf.style.cssText = 'position:absolute;left:-99999px;top:0;width:1000px;height:1100px';
  tf.src = '/';
  document.body.appendChild(tf);
  await new Promise((r) => { tf.onload = r; setTimeout(r, 8000); });
  const td = tf.contentDocument, tw = tf.contentWindow;
  /* A failing check with no note used to print "ok" beside the cross, because
     the note defaulted to 'ok' whatever the verdict — so the one line a reader
     scans for contradicted itself. */
  const tc = (n, ok, note) => { checks++; L.push((ok ? '\u00b7 ' : '\u2717 ') + ('tour:' + n).padEnd(34) + '  ' + (note || (ok ? 'ok' : 'FAILED'))); };
  const kip = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    await kip(500);
    // nothing appears unbidden
    tc('nothing opens by itself', !td.querySelector('.tpanel'));
    const door = td.querySelector('[data-tour]');
    tc('there is a door, and it is not in the nav', !!door && !door.closest('nav'),
      door?.textContent.trim());

    door.click(); await kip(400);
    const panel = () => td.querySelector('.tpanel');
    tc('it opens a modal dialog', panel()?.getAttribute('role') === 'dialog'
      && panel()?.getAttribute('aria-modal') === 'true');
    tc('step 1 offers one class of target',
      td.querySelectorAll('.tface').length === 4
      && td.querySelectorAll('.tpanel button:not(.tclose):not(.tface)').length === 0,
      td.querySelectorAll('.tface').length + ' faces, ' +
      td.querySelectorAll('.tpanel button:not(.tclose):not(.tface)').length + ' other buttons');
    /* No Next until something has been pressed. That IS the mechanic: the
       consequence is the instruction, so an unearned Next skips the lesson. */
    tc('no Next before anything is pressed', !td.querySelector('[data-tnext]'));

    const before = td.documentElement.dataset.ch;
    td.querySelector('[data-tch="flame"]').click(); await kip(450);
    tc('pressing a face changes the whole site', td.documentElement.dataset.ch === 'flame',
      before + ' -> ' + td.documentElement.dataset.ch);
    tc('and only then does Next appear', !!td.querySelector('[data-tnext]'));
    const said = td.querySelector('.tsaid-c')?.textContent || '';
    tc('it says what just happened', /Flame/.test(said), said.slice(0, 46));
    tc('and the detail line is not addressed to a third party',
      !/your child/i.test(td.querySelector('.tsaid-more')?.textContent || ''));

    td.querySelector('[data-tnext]').click(); await kip(400);
    tc('step 2 shows real sums', td.querySelectorAll('.tsum').length === 3,
      [...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim()).join(' '));
    tc('the sums are distinct',
      new Set([...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim())).size === 3);
    const first = [...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim()).join('|');
    td.querySelector('[data-tnew]').click(); await kip(400);
    const second = [...td.querySelectorAll('.tsum')].map((e) => e.textContent.trim()).join('|');
    tc('pressing it changes the numbers', first !== second, second);
    tc('and only then does Next appear', !!td.querySelector('[data-tdone]'));

    td.querySelector('[data-tdone]').click(); await kip(400);
    const rows = [...td.querySelectorAll('.tway dt')].map((e) => e.textContent.trim());
    tc('the last panel maps the site', rows.length >= 8, rows.join(', '));
    /* The features a new visitor most needs and least easily finds. /plans/ has
       zero editorial inbound links in the whole site, so a tour that omits it
       leaves it exactly as invisible as it was. */
    for (const want of ['Grades', 'Books', 'Games', 'Printables', 'Badges', 'By skill', 'Plans', 'How to help']) {
      checks++;
      if (!rows.includes(want)) L.push('\u2717 ' + ('tour:names ' + want).padEnd(34) + '  MISSING');
    }
    const mapText = td.querySelector('.tways').textContent;
    tc('no unresolved count placeholder', !/\{\w+\}|undefined|NaN/.test(mapText),
      (mapText.match(/\{\w+\}|undefined|NaN/) || ['clean'])[0]);
    /* Derived, never literal. This asserted a hard-coded 45 and went red the
       day the catalogue grew — the point is that the tour quotes the REAL
       counts, so the expected value has to come from the same place the tour
       gets it from. */
    const wantTotal = String(A.activities.length);
    const wantBadges = String(BG.BADGE_COUNT);
    tc('counts are real numbers',
      new RegExp('\\b' + wantTotal + '\\b').test(mapText) && new RegExp('\\b' + wantBadges + '\\b').test(mapText),
      `${wantTotal} activities, ${wantBadges} badges`);
    tc('it offers a way on and a way to everything',
      !!td.querySelector('.tfoot .btn.pri') && /guide/.test(td.querySelector('.tfoot .btn:not(.pri)')?.href || ''));

    // Escape closes it and the chosen character survives
    tw.dispatchEvent(new tw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    td.dispatchEvent(new tw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await kip(300);
    tc('Escape closes it', !td.querySelector('.tpanel'));
    tc('the character you chose stays chosen', td.documentElement.dataset.ch === 'flame');
  } catch (e) {
    tc('harness itself', false, 'THREW ' + e.message);
  }
  tf.remove();
}

L.push(''); L.push('CHECKS_RUN='+checks);
document.getElementById('out').textContent=L.join('\n');
window.__DONE__=true;
</script></body></html>
